  }

  /* ---------------- 导出 ---------------- */
  var currentSet = null;

  function docItemsHtml(set, opt) {
    var out = '';
    set.items.forEach(function (x, i) {
      out += '<article class="prob" data-t="' + tierOf(x) + '">';
      out += '<div class="prob-head"><span class="idx">' + (i + 1) + '.</span>' +
        '<span class="badge t' + tierOf(x) + '">' + TIER[tierOf(x)] + '</span>' +
        (x.p.k ? '<span class="badge k">' + esc(x.p.k) + '</span>' : '') +
        (opt.showSec === false ? '' : '<span class="badge sec">' + esc(x.sec.num) + ' ' + esc(stripTex(x.sec.title)) + '</span>') +
        '</div>';
      out += '<div class="q">' + E(x.p.q) + '</div>';
      if (!opt.withAnswers && opt.writing) out += '<div class="writing"></div>';
      if (opt.withAnswers) out += '<div class="sol"><div class="solhd">答案与解析</div>' + E(x.p.s) + '</div>';
      out += '</article>';
    });
    return out;
  }

  function buildDoc(set, opt) {
    var head = '<h1>' + esc(set.title) + '</h1><div class="docsub">' + esc(set.sub || '') + '</div>';
    var body = (set.kind === 'preview') ? docPreviewHtml(set, opt) : docItemsHtml(set, opt);
    if (!opt.withAnswers) {
      body += '<div class="docsub" style="margin-top:6mm;font-size:9.5pt;color:#666">（试看版不提供答案版导出。）</div>';
    }
    var pitSecs = {}, pitOrder = [];
    set.items.forEach(function (x) {
      if (x.sec && !pitSecs[x.sec.num]) { pitSecs[x.sec.num] = x.sec; pitOrder.push(x.sec.num); }
    });
    var pitHtml = '';
    pitOrder.forEach(function (n) {
      var s0 = pitSecs[n], pf = (s0 && s0.pitfalls) || [];
      if (!pf.length) return;
      pitHtml += '<div class="pitblock"><div class="pitsub">' + esc(n) + ' ' + esc(stripTex(s0.title)) + '</div><ul>';
      pf.forEach(function (p) { pitHtml += '<li><b>' + esc(p.k) + '</b>' + E(p.v) + '</li>'; });
      pitHtml += '</ul></div>';
    });
    if (pitHtml) body += '<div class="pitwrap"><h2>易错点速查</h2>' + pitHtml + '</div>';
    return '<div class="doc">' + head + body + '</div>';
  }

  function fullHtmlDoc(set, opt) {
    var css = '';
    try {
      var el = global.document && global.document.getElementById('appcss');
      css = el ? el.textContent : '';
    } catch (e) { css = ''; }
    var printCss = '@page{size:A4;margin:16mm 14mm}body{background:#fff;margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",serif;font-size:11.5pt;line-height:1.7;color:#000}' +
      '.doc{max-width:100%;padding:0}' +
      '.doc h1{font-size:17pt;margin:0 0 2mm}' +
      '.doc .docsub{font-size:9.5pt;color:#444;margin-bottom:5mm}' +
      '.doc .prob{border:none;border-left:2px solid #888;border-radius:0;padding:0 0 0 3mm;margin:0 0 5mm;box-shadow:none;page-break-inside:avoid;background:#fff}' +
      '.doc .badge{border:1px solid #999;background:#fff;color:#000;font-size:8.5pt}' +
      '.doc .prob-head{font-size:9pt;color:#333;display:flex;gap:6px;align-items:center;margin-bottom:2mm}' +
      '.doc .prob-head .idx{font-weight:700;font-size:11.5pt}' +
      '.doc .sol{border-top:1px dashed #bbb;margin-top:2mm;padding-top:1.5mm;page-break-inside:avoid;background:#fff}' +
      '.doc .solhd{font-size:8.5pt;color:#666;font-weight:700}' +

      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>' + esc(set.title) + '</title><style>' + css + '\n' + printCss + '</style></head><body>' +
      buildDoc(set, opt) + '</body></html>';
  }

  function mdDoc(set, opt) {
    var out = '# ' + set.title + '\n\n';
    if (set.sub) out += '> ' + set.sub + '\n\n';
    set.items.forEach(function (x, i) {
      out += '## ' + (i + 1) + '. 【' + TIER[tierOf(x)] + '】' + (x.p.k ? '（' + x.p.k + '）' : '') + '\n\n';
      out += x.p.q + '\n\n';
      if (opt.withAnswers) out += '**答案与解析**：' + x.p.s + '\n\n';
      out += '---\n\n';
    });
    return out;
  }

  function download(name, text, mime) {
    if (global.document) {
      var blob = new Blob([text], { type: mime + ';charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }
  }
  function safeName(s) { return String(s).replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 60); }

  function doPrint(set, opt) {
    if (!global.document) return;
    var root = document.getElementById('printRoot');
    root.innerHTML = buildDoc(set, opt);
    global.print();
  }
  function doExport(set, kind, opt) {
    if (kind === 'html') {
      download(safeName(set.title) + '.html', fullHtmlDoc(set, opt), 'text/html');
    } else if (kind === 'md') {
      download(safeName(set.title) + '.md', mdDoc(set, opt), 'text/markdown');
    }
  }

  /* ---------------- 视图：搜索 ---------------- */
  function viewSearch(params) {
    var q = (params && params.q != null) ? params.q : (state.searchQ || '');
    state.searchQ = q;
    var terms = String(q).trim().toLowerCase().split(/\s+/).filter(Boolean);
    var results = [];
    if (terms.length) {
      everyProb.forEach(function (x) {
        var hay = (x.sec.num + ' ' + x.sec.title + ' ' + (x.p.k || '') + ' ' + (x.p.q || '') + ' ' + (x.p.s || '')).toLowerCase();
        for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) < 0) return;
        if (state.searchUndone && st(x.key)) return;
        if (state.searchWrong && st(x.key) !== 'bad') return;
        results.push(x);
      });
    }
    var tagCount = {};
    everyProb.forEach(function (x) { if (x.p.k) tagCount[x.p.k] = (tagCount[x.p.k] || 0) + 1; });
    var topTags = Object.keys(tagCount).sort(function (a, b) { return tagCount[b] - tagCount[a]; }).slice(0, 20);

    var html = '';
    html += '<div class="pagehead"><h1>搜索题目</h1><div class="sub">输入关键词（可空格分隔多个）搜索题干、解析与知识点标签；也可以直接点下面的知识点。回车即搜索。</div></div>';
    html += '<div class="searchbar"><input type="search" data-act="searchinput" placeholder="例如：秩不等式、Eisenstein、正交投影、Jordan、易错…" value="' + esc(q) + '" aria-label="搜索关键词"><button class="btn primary" data-act="dosearch">搜索</button></div>';
    html += '<div class="row" style="margin:10px 0 6px">' +
      '<label class="chk"><input type="checkbox" data-act="searchopt" data-k="undone"' + (state.searchUndone ? ' checked' : '') + '> 只看没做过的</label>' +
      '<label class="chk"><input type="checkbox" data-act="searchopt" data-k="wrong"' + (state.searchWrong ? ' checked' : '') + '> 只看做错的</label>' +
      '<span class="label" style="color:#8798b3">题库共 ' + allProbs.length + ' 道题</span></div>';
    html += '<div class="tagcloud">' + topTags.map(function (t) {
      return '<button class="tag" data-act="searchtag" data-tag="' + esc(t) + '">' + esc(t) + '<i>' + tagCount[t] + '</i></button>';
    }).join('') + '</div>';

    if (terms.length) {
      html += '<div class="row" style="margin:16px 0 10px"><b>找到 ' + results.length + ' 道题</b>' +
        (results.length > 40 ? '<span class="label">（只显示前 40 道，加关键词可缩小范围）</span>' : '') + '</div>';
      if (results.length) {
        html += toolbar('<button class="btn small" data-act="solall">全部显示解析</button>');
        html += probList(results.slice(0, 40), { showSol: false, showSec: true });
      } else {
        html += '<div class="empty">没有匹配的题目，换个关键词试试。</div>';
      }
    }
    return {
      title: '搜索题目',
      html: html,
      set: results.length ? { title: '搜索结果 · ' + q, sub: '匹配 ' + results.length + ' 道题', items: results.slice(0, 40) } : null
    };
  }

  /* ---------------- 视图：课前预习 ---------------- */
  function viewPreview(num) {
    var ref = secMap[num];
    if (!ref) return { title: '未找到', html: '<div class="empty">没有找到小节 ' + esc(num) + '。</div>', set: null };
    var sec = ref.sec, ch = ref.chapter;
    var thms = sec.theorems || [];
    var prevs = sec.preview || [];

    var html = '';
    html += '<div class="crumb">第 ' + ch.num + ' 章 ' + E(ch.title) + ' / <b>' + sec.num + ' 课前预习</b></div>';
    html += '<div class="pagehead"><h1>' + E(sec.title) + '</h1>' +
      '<div class="sub">先扫一遍教材本节，摸清“本节骨架”，再对每张定理卡做三连问，最后做预习小测——目标是带着问题进课堂。</div></div>';
    if (sec.url) html += '<div class="row" style="margin-bottom:12px"><a class="btn small" href="' + esc(sec.url) +
      '" target="_blank" rel="noopener">📖 打开教材本节原文 ↗</a></div>';

    /* —— 本节骨架：按「定理密集度」分级，1~3 张，只放真正值得三连问的核心定理 —— */
    var dense = thms.length;
    var spineNames = thms.map(function (t, i) {
      return '定理 ' + (i + 1) + ' ' + stripTex(t.name || '（未命名）');
    });
    var denseLabel = dense <= 1 ? '定理稀疏 · 1 张' : (dense === 2 ? '定理较密 · 2 张' : '定理密集 · 3 张');
    html += '<div class="card spine">' +
      '<div class="spinehd">本节骨架<span class="spinebadge">' + denseLabel + '</span></div>' +
      (dense ? '<div class="spinetxt">' + spineNames.map(function (s) { return esc(s); }).join(' <span class="arr">→</span> ') + '</div>' : '') +
      '<div class="spinenote">' +
      (dense > 1
        ? '这一节的定理比较密集：先把上面这条“骨架”串起来（谁是谁的前提、谁由谁推出），再逐张做三连问。'
        : '这一节只有 1 个核心定理，属于“骨架单一”的节：把它的前提、结论、反例吃透就够了，不必为凑数硬背别的结论。') +
      '</div></div>';

    html += '<div class="note">读定理时按这个顺序追问：<b>①</b> 前提是什么？<b>②</b> 结论是什么？' +
      '<b>③</b> 少一个条件还成立吗（能举反例吗）？最后再看一个最简单的例子把它“跑通”。</div>';

    if (!thms.length) html += '<div class="empty">这一节的预习卡片还在补充中。</div>';
    thms.forEach(function (t, i) {
      html += '<div class="card thmcard">';
      html += '<div class="thmname"><span class="thmno">定理 ' + (i + 1) + '</span>' + esc(t.name || '') +
        (dense > 1 ? '<span class="thmcnt">' + (i + 1) + ' / ' + dense + '</span>' : '') + '</div>';
      html += '<div class="thmrow"><b>① 前提</b><div>' + E(t.prem) + '</div></div>';
      html += '<div class="thmrow"><b>② 结论</b><div>' + E(t.concl) + '</div></div>';
      html += '<div class="thmrow"><b>③ 少一个条件还成立吗？</b><div>' +
        '<button class="btn small ghost" data-act="thmtoggle">先自己想，再点开对照</button>' +
        '<div class="thmhint" hidden>' + E(t.drop) + '</div></div></div>';
      html += '<div class="thmrow"><b>④ 一个最简单的例子</b><div>' +
        '<button class="btn small ghost" data-act="thmtoggle">自己举一个例子再对照</button>' +
        '<div class="thmhint" hidden>' + E(t.ex) + '</div></div></div>';
      html += '</div>';
    });

    if (prevs.length) {
      html += '<div class="pagehead" style="margin-top:20px"><h1 style="font-size:18px">预习小测（' + prevs.length +
        ' 题 · 难度不大）</h1><div class="sub">读完教材就能答，用来检查你是否真看懂定义与定理的条件。</div></div>';
      html += '<div class="toolbar"><button class="btn small" data-act="solall">全部显示参考</button><span class="spacer"></span>' +
        '<button class="btn small" data-act="export" data-kind="pdf">下载预习单 PDF</button></div>';
      prevs.forEach(function (p, i) {
        html += '<article class="prob" data-t="1">';
        html += '<div class="prob-head"><span class="idx">' + (i + 1) + '.</span><span class="badge t1">预习</span>' +
          (p.k ? '<span class="badge k">' + esc(p.k) + '</span>' : '') + '</div>';
        html += '<div class="q">' + E(p.q) + '</div>';
        html += '<div class="sol" hidden><div class="solhd">参考答案</div>' + E(p.s) + '</div>';
        html += '<div class="row" style="margin-top:10px"><button class="btn small ghost" data-act="sol">显示参考</button></div>';
        html += '</article>';
      });
    }

    html += '<div class="row" style="margin-top:10px">' +
      '<button class="btn primary" data-act="gosec" data-sec="' + sec.num + '">预习完了，去做本节练习 →</button>' +
      '<button class="btn" data-act="go" data-view="browse">← 返回章节列表</button></div>';

    return {
      title: sec.num + ' 课前预习',
      html: html,
      set: {
        kind: 'preview',
        title: sec.num + ' ' + stripTex(sec.title) + ' · 课前预习单',
        sub: '本节骨架（核心定理 ' + dense + ' 张）+ 定理三连问 + 预习小测　' + todayKey() + (sec.url ? '　教材：' + sec.url : ''),
        items: [],
        theorems: thms,
        preview: prevs,
        spine: spineNames.map(function (s) { return stripTex(s); })
      }
    };
  }

      html += '</div></div>';
    });
    return { title: '刷教材', html: html, set: null };
  }

  function viewTbSection(num) {
    var ref = secMap[num];
    var items = tbOf(num);
    if (!ref || !items.length) return { title: '刷教材', html: '<div class="empty">这一节没有教材题。</div>', set: null };
    var sec = ref.sec, ch = ref.chapter;
    var nEasy = items.filter(function (x) { return +x.p.t === 1; }).length;
    var html = '';
    html += '<div class="crumb">第 ' + ch.num + ' 章 ' + E(ch.title) + ' / <b>' + sec.num + '</b> 刷教材</div>';
    html += '<div class="pagehead"><h1>' + E(sec.title) + '</h1>' +
      '<div class="sub">教材原题 ' + items.length + ' 道：易错 ' + nEasy + ' 道 · 高频 ' + (items.length - nEasy) + ' 道（挑战题已剔除）</div></div>';
    if (sec.url) {
      html += '<div class="row" style="margin-bottom:10px"><a class="btn small" href="' + esc(sec.url) +
        '" target="_blank" rel="noopener">📖 翻到教材本节 ↗</a></div>';
    }
    html += toolbar('<button class="btn small" data-act="solall">全部显示解析</button>');
    html += '<div class="tb-list">';
    items.forEach(function (x, i) {
      var s0 = st(x.key);
      html += '<article class="prob tb' + (s0 === 'ok' ? ' st-ok' : s0 === 'bad' ? ' st-bad' : '') + '" data-key="' + esc(x.key) + '" data-t="' + tierOf(x) + '">';
      html += '<div class="prob-head">';
      html += '<span class="idx">' + (i + 1) + '.</span>';
      html += '<span class="badge ' + (+x.p.t === 1 ? 't1' : 't2') + '">' + (+x.p.t === 1 ? '易错' : '高频') + '</span>';
      if (x.tag && x.tag.indexOf('·') >= 0) html += '<span class="badge k">' + esc(x.tag) + '</span>';
      if (x.p.k) html += '<span class="badge k">' + esc(x.p.k) + '</span>';
      if (x.src) html += '<span class="badge src" title="教材来源">教材 ' + esc(x.src) + '</span>';
      html += '<span class="prob-actions">' +
        '<button class="iconbtn' + (s0 === 'ok' ? ' on' : '') + '" data-act="mark" data-key="' + esc(x.key) + '" data-v="ok">✔ 做对</button>' +
        '<button class="iconbtn' + (s0 === 'bad' ? ' on bad' : '') + '" data-act="mark" data-key="' + esc(x.key) + '" data-v="bad">✘ 做错</button>' +
        '<button class="iconbtn' + (state.stars[x.key] ? ' on star' : '') + '" data-act="star" data-key="' + esc(x.key) + '">☆</button>' +
        '</span>';
      html += '</div>';
      html += '<div class="q">' + E(x.p.q) + '</div>';
      html += '<div class="sol" hidden><div class="solhd">答案与解析</div>' + E(x.p.s) + '</div>';
      html += '<div class="row" style="margin-top:10px"><button class="btn small ghost" data-act="sol" data-key="' + esc(x.key) + '">显示解析</button></div>';
      html += '</article>';
    });
    html += '</div>';
    html += '<div class="row" style="margin-top:8px">' +
      '<button class="btn" data-act="go" data-view="tb">← 返回教材目录</button>' +
      '<button class="btn" data-act="gosec" data-sec="' + sec.num + '">去做本节的原创练习</button></div>';
    return {
      title: '刷教材 · ' + sec.num,
      html: html,
      set: {
        title: '教材原题 · ' + sec.num + ' ' + stripTex(sec.title),
        sub: '易错 ' + nEasy + ' 道 · 高频 ' + (items.length - nEasy) + ' 道（挑战题已剔除）　' + todayKey(),
        items: items
      }
    };
  }

  /* ---------------- 视图：选择填空专项 ---------------- */
  function viewChoiceFill() {
    var list = cfSections();
    var totalN = list.reduce(function (a, r) { return a + r.list.length; }, 0);
    var html = '<div class="pagehead"><h1>选择填空专项</h1>' +
      '<div class="sub">按节练选择/填空，单点一个知识点、1 分钟一条。只显示有这类题的节——没有的节不出现。</div></div>';
    if (!list.length) {
      html += '<div class="empty">还没有选择填空数据。</div>';
      return { title: '选择填空', html: html, set: null };
    }
    var done = 0, right = 0;
    Object.keys(state.cfRec).forEach(function (k) { done++; if (state.cfRec[k].right) right++; });
    html += '<div class="stats" style="margin-bottom:14px">' +
      '<div class="stat"><div class="v">' + totalN + '</div><div class="l">题库总条数</div></div>' +
      '<div class="stat"><div class="v">' + list.length + '</div><div class="l">覆盖节数</div></div>' +
      '<div class="stat"><div class="v">' + done + '</div><div class="l">已作答</div></div>' +
      '<div class="stat"><div class="v">' + (done ? Math.round(right / done * 100) : 0) + '%</div><div class="l">正确率</div></div>' +
      '</div>';
    chapters.forEach(function (ch) {
      var rows = list.filter(function (r) { return r.chapter.num === ch.num; });
      if (!rows.length) return;
      html += '<div class="card" style="margin-bottom:12px">' +
        '<div class="row" style="align-items:center"><div style="flex:1;font-weight:700">第 ' + ch.num + ' 章　' + E(ch.title) + '</div>' +
        '<span class="label" style="color:#8798b3">' + rows.reduce(function (a, r) { return a + r.list.length; }, 0) + ' 条</span></div>' +
        '<div class="row" style="margin-top:10px">';
      rows.forEach(function (r) {
        var k = 'CF' + r.sec.num + '#';
        var cnt = Object.keys(state.cfRec).filter(function (x) { return x.indexOf(k) === 0; }).length;
        html += '<button class="btn small" data-act="gocf" data-sec="' + r.sec.num + '">' +
          '<b style="color:#2f6bff">' + r.sec.num + '</b> ' + E(r.sec.title) +
          '<span class="label" style="color:#93a5c4">（' + cnt + '/' + r.list.length + '）</span></button>';
      });
      html += '</div></div>';
    });
    return { title: '选择填空', html: html, set: null };
  }

  function viewCfSection(num) {
    var ref = secMap[num];
    var items = cfOf(num);
    if (!ref || !items.length) return { title: '选择填空', html: '<div class="empty">这一节没有选择填空题。</div>', set: null };
    var sec = ref.sec, ch = ref.chapter;
    var html = '';
    html += '<div class="crumb">第 ' + ch.num + ' 章 ' + E(ch.title) + ' / <b>' + sec.num + '</b> 选择填空</div>';
    html += '<div class="pagehead"><h1>' + E(sec.title) + '</h1><div class="sub">' + items.length + ' 条：选择选一个，填空自己算（答案在下面）</div></div>';
    items.forEach(function (it, i) {
      var key = 'CF' + num + '#' + i;
      var rec = state.cfRec[key];
      var cls = 'cf-item' + (rec ? (rec.right ? ' right' : ' wrong') : '');
      html += '<article class="card ' + cls + '" data-cf="' + esc(key) + '">';
      html += '<div class="prob-head">' +
        '<span class="idx">' + (i + 1) + '.</span>' +
        '<span class="badge ' + (it.type === '选择' ? 't2' : 't1') + '">' + esc(it.type) + '</span>' +
        (it.k ? '<span class="badge k">' + esc(it.k) + '</span>' : '') +
        (rec ? '<span class="badge ' + (rec.right ? 't1' : 'sec') + '">' + (rec.right ? '已答对' : '答错了') + '</span>' : '') +
        '</div>';
      html += '<div class="q">' + E(it.q) + '</div>';
      if (it.type === '选择') {
        html += '<div class="cf-opts">';
        it.options.forEach(function (op, k) {
          var letter = 'ABCD'[k];
          var mark = '';
          var cls2 = 'cf-opt';
          if (rec) {
            if (letter === String(it.a).trim()) { cls2 += ' is-right'; mark = ' ✔'; }
            else if (rec.pick === letter) { cls2 += ' is-wrong'; mark = ' ✘'; }
            else cls2 += ' muted';
          }
          html += '<button class="' + cls2 + '" data-act="cfpick" data-key="' + esc(key) + '" data-pick="' + letter + '">' +
            '<b>' + letter + '.</b> ' + E(String(op).replace(/^\s*[A-D][.、]\s*/, '')) + mark + '</button>';
        });
        html += '</div>';
      } else {
        html += '<div class="row" style="margin-top:8px">' +
          '<button class="btn small ghost" data-act="cfshow" data-key="' + esc(key) + '">看答案</button></div>';
      }
      html += '<div class="sol cf-sol"' + (rec ? '' : ' hidden') + '>' +
        '<div class="solhd">答案' + (it.type === '选择' ? '（' + esc(String(it.a).trim()) + '）' : '') + '</div>' +
        (it.type === '填空' ? '<div style="margin-bottom:6px">' + E(it.a) + '</div>' : '') +
        (it.s ? '<div class="cf-ana">' + E(it.s) + '</div>' : '') +
        '</div>';
      html += '</article>';
    });
    html += '<div class="row" style="margin-top:8px"><button class="btn" data-act="go" data-view="cf">← 返回选择填空目录</button></div>';
    return { title: '选择填空 · ' + sec.num, html: html, set: null };
  }

  /* ---------------- 路由 ---------------- */
  var ROUTES = {
    home: viewHome,
    today: viewToday,
    browse: viewBrowse,
    section: function (p) { return viewSection(p.sec, p.mode); },
    test: function (p) { return viewTest(p.ch, p.fresh); },
    quizsetup: viewQuizSetup,
    quizrun: viewQuizRun,
    preview: function (p) { return viewPreview(p.sec); },
    search: function (p) { return viewSearch(p); },
    wrong: viewWrong,
    stats: viewStats,
    help: viewHelp,
    tb: viewTextbook,
    tbsec: function (p) { return viewTbSection(p.sec); },
    cf: viewChoiceFill,
    cfsec: function (p) { return viewCfSection(p.sec); }
  };

  function render(view, params) {
    var fn = ROUTES[view] || viewToday;
    var res = fn(params || {});
    currentSet = res.set || null;
    return res;
  }

  /* ---------------- 选择填空作答 ---------------- */
  function cfAnswer(key, pick) {
    var rec = cfKeys[key];
    if (!rec) return null;
    var it = rec.item;
    var right;
    if (it.type === '选择') right = String(pick).trim().toUpperCase() === String(it.a).trim().toUpperCase();
    else right = true;             /* 填空题自己看答案，点了「看答案」就算完成 */
    state.cfRec[key] = { pick: String(pick || ''), right: right, ts: Date.now() };
    saveState();
    return { right: right, item: it, num: rec.num, idx: rec.idx };
  }

  /* ---------------- 导出给测试与 DOM 层 ---------------- */
  global.App = {
    state: function () { return state; },
    init: function () { state = loadState(); return state; },
    setState: function (s) { state = s; saveState(); },
    importState: function (raw) {
      var r = sanitizeImported(raw);
      if (r.ok) { state = r.state; saveState(); }
      return { ok: r.ok, err: r.err, dropped: r.dropped || 0, repaired: r.repaired || 0 };
    },
    reset: function () { state = defaultState(); saveState(); },
    render: render,
    routes: Object.keys(ROUTES),
    chapters: chapters,
    allProbs: allProbs,
    probByKey: probByKey,
    secMap: secMap,
    util: {
      esc: esc, todayKey: todayKey, stripTex: stripTex, tierOf: tierOf,
      poolByScope: poolByScope, pickTier: pickTier, countsOfChapter: countsOfChapter, fmtDur: fmtDur,
      st: function (k) { return st(k); }
    },
    currentSet: function () { return currentSet; },
    setCurrentSet: function (s) { currentSet = s; },
    mark: function (key, v) { mark(key, v); },
    toggleStar: function (key) { toggleStar(key); },
    save: saveState,
    resetTodayKeys: resetTodayKeys,
    startTest: startTest,
    genQuiz: genQuiz,
    buildDoc: buildDoc,
    fullHtmlDoc: fullHtmlDoc,
    mdDoc: mdDoc,
    doPrint: doPrint,
    doExport: doExport,
    download: download,
    safeName: safeName,
    streakDays: streakDays,
    totalCheckedIn: totalCheckedIn,
    TIER: TIER,
    TIER_DESC: TIER_DESC,
    scopeLabel: scopeLabel,
    /* —— 新增：刷教材 / 选择填空 / 学习会话 / 每日励志语 —— */
    textbook: { byNum: tbByNum, all: tbProbs, sections: tbSections, of: tbOf },
    choicefill: { byNum: cfByNum, sections: cfSections, of: cfOf, keys: cfKeys },
    cfAnswer: cfAnswer,
    quoteOfDay: quoteOfDay,
    study: {
      todaySecs: todayStudySecs, totalSecs: totalStudySecs, fmt: fmtStudy,
      start: startSession, tick: tickSession, end: endSession, secs: sessionSecs,
      restDue: restDue, markRest: markRest, REST_MIN: REST_MIN
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   高代研习录 —— 界面层（DOM 绑定）
   ========================================================================== */
(function (global) {
  'use strict';
  var A = global.App;
  if (!A) return;

  var mainEl, treeEl, sideEl, toastEl, modalEl = null;
  var cur = { view: 'today', params: {} };
  var openChs = {};
  var solAll = false;

  /* ---------------- 小工具 ---------------- */
  function $(id) { return global.document.getElementById(id); }
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 2100);
  }
  function confirmBox(msg, onYes) {
    lastFocus = global.document.activeElement;
    closeModal();
    var d = global.document.createElement('div');
    d.className = 'modal';
    d.setAttribute('role', 'dialog');
    d.setAttribute('aria-modal', 'true');
    d.innerHTML = '<div class="box"><h3>请确认</h3><p>' + msg + '</p>' +
      '<div class="row"><span class="spacer"></span>' +
      '<button class="btn" data-act="modalclose">取消</button>' +
      '<button class="btn primary" data-act="modalyes">确定</button></div></div>';
    d.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'modalclose') closeModal();
      if (b.dataset.act === 'modalyes') { closeModal(); onYes(); }
    });
    global.document.body.appendChild(d);
    modalEl = d;
    focusIn(d);
  }
  var lastFocus = null;
  function focusIn(d) {
    var f = d.querySelector('.btn.primary, button');
    if (f && f.focus) f.focus();
  }
  function closeModal() {
    if (modalEl && modalEl.parentNode) modalEl.parentNode.removeChild(modalEl);
    modalEl = null;
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
    lastFocus = null;
  }

  /* ---------------- 侧栏 ---------------- */
  function buildTree() {
    var html = '';
    var esc = A.util.esc;
    A.chapters.forEach(function (ch) {
      var open = openChs[ch.num] ? ' open' : '';
      html += '<div class="chap' + open + '" data-chap="' + esc(ch.num) + '">';
      html += '<button class="chaphead" data-act="togchap" data-ch="' + esc(ch.num) + '">' +
        '<span class="cn">' + esc(ch.num) + '</span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(A.util.stripTex(ch.title)) + '</span>' +
        '<span class="caret">▶</span></button>';
      html += '<div class="chapbody">';
      ch.sections.forEach(function (sec) {
        var c = 0, done = 0;
        A.allProbs.forEach(function (x) {
          if (x.sec.num === sec.num) { c++; if (A.util.st(x.key)) done++; }
        });
        var cls = 'secbtn' + (done >= c && c > 0 ? ' done' : '');
        html += '<button class="' + cls + '" data-act="gosec" data-sec="' + esc(sec.num) + '">' +
          '<span class="sn">' + esc(sec.num) + '</span><span>' + esc(A.util.stripTex(sec.title)) + '</span></button>';
      });
      html += '</div></div>';
    });
    treeEl.innerHTML = html;
  }
  function highlightTree() {
    var target = (cur.view === 'section' && cur.params.sec) || '';
    var nodes = treeEl.querySelectorAll('.secbtn');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.toggle('active', nodes[i].dataset.sec === target);
    }
    if (target) {
      var ref = A.secMap[target];
      if (ref && !openChs[ref.chapter.num]) {
        openChs[ref.chapter.num] = true;
        buildTree();
        highlightTree();
      }
    }
  }
  function updateSideFoot() {
    var done = 0;
    A.allProbs.forEach(function (x) { if (A.util.st(x.key)) done++; });
    var s = $('sfStreak'), d = $('sfDone');
    if (s) s.textContent = A.streakDays();
    if (d) d.textContent = done;
    updateStudyChip();
  }

  /* ---------------- 学习会话计时 ---------------- */
  var studyTicker = null, restOpen = false;
  function studyChip() { return $('sfStudy'); }
  function updateStudyChip() {
    var el = studyChip();
    if (!el) return;
    var secs = A.study.secs();
    var running = !!A.state().session;
    el.textContent = running ? ('本次已学 ' + A.study.fmt(secs)) : ('今日已学 ' + A.study.fmt(A.study.todaySecs()));
    el.classList.toggle('on', running);
  }
  function ensureTicker() {
    if (studyTicker) return;
    studyTicker = setInterval(function () {
      if (!A.state().session) { updateStudyChip(); return; }
      A.study.tick();
      updateStudyChip();
      if (A.study.restDue() && !restOpen) showRest();
      /* 每 10 秒落盘一次，避免关页丢时长 */
      if (A.study.secs() % 10 < 1) A.save();
    }, 1000);
  }
  var ENCOURAGE = [
    '已经连续学了 {{m}} 分钟，这一节最难的部分你已经啃过去了。',
    '{{m}} 分钟了。起身走两步、看看远处，眼睛和脑子都需要喘口气。',
    '你现在的状态，比 45 分钟前好很多。休息 5 分钟，回来还能再战。',
    '{{m}} 分钟专注，已经超过大多数人今天的学习量了。',
    '这道题卡住不是你的问题，是时候换换脑子了。'
  ];
  function showRest() {
    if (restOpen) return;
    restOpen = true;
    var mins = Math.round(A.study.secs() / 60);
    var msg = ENCOURAGE[Math.floor(mins / 45) % ENCOURAGE.length].replace('{{m}}', mins);
    lastFocus = global.document.activeElement;
    closeModal();
    var d = document.createElement('div');
    d.className = 'modal rest-modal';
    d.setAttribute('role', 'dialog');
    d.setAttribute('aria-modal', 'true');
    d.innerHTML = '<div class="box">' +
      '<div class="rest-kicker">该歇一下了</div>' +
      '<h3>学习 ' + mins + ' 分钟 · 建议休息</h3>' +
      '<p>' + A.util.esc(msg) + '</p>' +
      '<p style="font-size:13px;color:#6b7a93">起身喝水、走两分钟、看看窗外。' +
      '回来点「继续学习」就好，计时不会断 —— 休息也是学习的一部分。</p>' +
      '<div class="row"><span class="spacer"></span>' +
      '<button class="btn" data-act="restclose">再学一会儿</button>' +
      '<button class="btn primary" data-act="restclose">休息好了，继续</button></div></div>';
    d.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'restclose') { A.study.markRest(); restOpen = false; closeModal(); }
    });
    document.body.appendChild(d);
    modalEl = d;
    focusIn(d);
  }
  function startStudy(targetView) {
    A.study.start();
    ensureTicker();
    updateStudyChip();
    go(targetView || 'today', {});
    toast('开始计时 · 每 45 分钟会提醒你休息');
  }
  function endStudy() {
    if (!A.state().session) { toast('还没有开始学习'); return; }
    var secs = A.study.secs();
    confirmBox('结束今天的学习？本次已学 <b>' + A.study.fmt(secs) + '</b>，将记入学习统计。',
      function () {
        var r = A.study.end();
        updateStudyChip();
        toast('已结束 · 本次 ' + A.study.fmt(r.secs) + '，今日累计 ' + A.study.fmt(A.study.todaySecs()));
        try { global.close(); } catch (e) { /* 多数浏览器不允许脚本关页 */ }
        setTimeout(function () {
          if (global.closed) return;
          go('stats', {});
        }, 250);
      });
  }

  /* ---------------- 草稿区（平板手写演算） ---------------- */
  var scratchEl = null, scratchCanvas = null, scratchCtx = null;
  var strokes = [], curStroke = null, scratchPen = { color: '#16203a', width: 2.4 };
  function buildScratch() {
    if (scratchEl) return;
    var fab = document.createElement('button');
    fab.className = 'scratch-fab';
    fab.type = 'button';
    fab.setAttribute('data-act', 'scrathtoggle');
    fab.setAttribute('aria-label', '打开草稿区');
    fab.innerHTML = '<span>✎</span><small>草稿</small>';
    document.body.appendChild(fab);

    scratchEl = document.createElement('aside');
    scratchEl.className = 'scratch-panel';
    scratchEl.setAttribute('aria-label', '草稿区');
    scratchEl.innerHTML =
      '<div class="scratch-hd"><b>草稿区</b>' +
      '<span class="label" style="color:#93a5c4">手写演算 · 不影响题目</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn small" data-act="scratchpen" data-color="#16203a">黑笔</button>' +
      '<button class="btn small" data-act="scratchpen" data-color="#d1483f">红笔</button>' +
      '<button class="btn small" data-act="scratchundo">撤销</button>' +
      '<button class="btn small" data-act="scratchclear">清空</button>' +
      '<button class="btn small ghost" data-act="scrathtoggle">收起</button>' +
      '</div>' +
      '<div class="scratch-body"><canvas class="scratch-cv"></canvas>' +
      '<div class="scratch-hint">在平板上用手指/笔直接写；电脑上用鼠标按住拖</div></div>';
    document.body.appendChild(scratchEl);
    scratchCanvas = scratchEl.querySelector('.scratch-cv');
    scratchCtx = scratchCanvas.getContext('2d');
    wireScratchCanvas();
  }
  function scratchResize() {
    if (!scratchCanvas) return;
    var r = scratchCanvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var dpr = Math.min(2, global.devicePixelRatio || 1);
    scratchCanvas.width = Math.round(r.width * dpr);
    scratchCanvas.height = Math.round(r.height * dpr);
    scratchCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scratchCtx.lineCap = 'round';
    scratchCtx.lineJoin = 'round';
    scratchReplay();
  }
  function scratchReplay() {
    if (!scratchCtx) return;
    var r = scratchCanvas.getBoundingClientRect();
    scratchCtx.clearRect(0, 0, r.width, r.height);
    strokes.forEach(function (s) {
      if (s.pts.length < 2) {
        var p0 = s.pts[0];
        if (!p0) return;
        scratchCtx.beginPath();
        scratchCtx.arc(p0.x, p0.y, s.width / 2, 0, Math.PI * 2);
        scratchCtx.fillStyle = s.color;
        scratchCtx.fill();
        return;
      }
      scratchCtx.beginPath();
      scratchCtx.strokeStyle = s.color;
      scratchCtx.lineWidth = s.width;
      scratchCtx.moveTo(s.pts[0].x, s.pts[0].y);
      for (var i = 1; i < s.pts.length; i++) scratchCtx.lineTo(s.pts[i].x, s.pts[i].y);
      scratchCtx.stroke();
    });
  }
  function wireScratchCanvas() {
    var drawing = false;
    function pos(e) {
      var r = scratchCanvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    scratchCanvas.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      drawing = true;
      try { scratchCanvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      curStroke = { color: scratchPen.color, width: scratchPen.width, pts: [pos(e)] };
      strokes.push(curStroke);
      scratchReplay();
    });
    scratchCanvas.addEventListener('pointermove', function (e) {
      if (!drawing || !curStroke) return;
      e.preventDefault();
      curStroke.pts.push(pos(e));
      scratchReplay();
    });
    function stop() { drawing = false; curStroke = null; }
    scratchCanvas.addEventListener('pointerup', stop);
    scratchCanvas.addEventListener('pointercancel', stop);
    scratchCanvas.addEventListener('pointerleave', stop);
    global.addEventListener('resize', function () { if (scratchEl && scratchEl.classList.contains('open')) scratchResize(); });
  }
  function toggleScratch(force) {
    buildScratch();
    var open = force == null ? !scratchEl.classList.contains('open') : !!force;
    scratchEl.classList.toggle('open', open);
    document.documentElement.classList.toggle('scratch-open', open);
    if (open) setTimeout(scratchResize, 30);
  }

  /* ---------------- 路由 ---------------- */
  function go(view, params) {
    cur = { view: view, params: params || {} };
    var res;
    try {
      res = A.render(view, cur.params);
    } catch (e) {
      console.error(e);
      mainEl.innerHTML = '<div class="empty">页面出错：' + A.util.esc(e.message) + '</div>';
      return;
    }
    solAll = false;
    mainEl.innerHTML = res.html || '';
    mainEl.scrollIntoView({ block: 'start' });
    var navs = document.querySelectorAll('#mainnav [data-view]');
    for (var i = 0; i < navs.length; i++) {
      var v = navs[i].dataset.view;
      var on = v === view || (v === 'browse' && (view === 'section' || view === 'test')) ||
        (v === 'quizsetup' && view === 'quizrun') ||
        (v === 'tb' && view === 'tbsec') || (v === 'cf' && view === 'cfsec');
      navs[i].classList.toggle('active', on);
    }
    document.title = (res.title ? A.util.stripTex(res.title) + ' · ' : '') + '高代研习录';
    highlightTree();
    updateSideFoot();
    updateStudyChip();
    sideEl.classList.remove('open');
  }

  /* ---------------- 题目交互 ---------------- */
  function articleOf(key) {
    var list = mainEl.querySelectorAll('.prob');
    for (var i = 0; i < list.length; i++) {
      if (list[i].dataset.key === key) return list[i];
    }
    return null;
  }
  function markKey(key, v, el) {
    var old = A.util.st(key);
    A.mark(key, old === v ? '' : v);
    var now = A.util.st(key);
    var art = articleOf(key);
    var btns = el.closest('.prob-actions');
    if (art) {
      art.classList.toggle('st-ok', now === 'ok');
      art.classList.toggle('st-bad', now === 'bad');
    }
    if (btns) {
      var okB = btns.querySelector('[data-v="ok"]'), badB = btns.querySelector('[data-v="bad"]');
      if (okB) okB.classList.toggle('on', now === 'ok');
      if (badB) { badB.classList.toggle('on', now === 'bad'); badB.classList.toggle('bad', now === 'bad'); }
    }
    updateSideFoot();
    if (now === 'bad') toast('已加入错题本');
  }
  function toggleSol(el) {
    var art = el.closest('.prob');
    if (!art) return;
    var sol = art.querySelector('.sol');
    var btn = art.querySelector('[data-act="sol"]');
    if (!sol) return;
    var hide = !sol.hasAttribute('hidden');
    if (hide) sol.setAttribute('hidden', ''); else sol.removeAttribute('hidden');
    if (btn) btn.textContent = hide ? '显示解析' : '收起解析';
  }
  function toggleSolAll() {
    solAll = !solAll;
    var sols = mainEl.querySelectorAll('.sol');
    for (var i = 0; i < sols.length; i++) {
      if (solAll) sols[i].removeAttribute('hidden'); else sols[i].setAttribute('hidden', '');
    }
    var btns = mainEl.querySelectorAll('[data-act="sol"]');
    for (var j = 0; j < btns.length; j++) btns[j].textContent = solAll ? '收起解析' : '显示解析';
    toast(solAll ? '已展开全部解析' : '已收起解析');
  }

  /* ---------------- 导出弹层 ---------------- */
  function exportModal() {
    lastFocus = global.document.activeElement;
    var set = A.currentSet();
    var nItems = (set && set.items ? set.items.length : 0) +
      (set && set.preview ? set.preview.length : 0) +
      (set && set.theorems ? set.theorems.length : 0);
    if (!set || !nItems) { toast('当前页面没有可导出的内容'); return; }
    closeModal();
    var title = '下载 PDF';
    var d = document.createElement('div');
    d.className = 'modal';
    d.setAttribute('role', 'dialog');
    d.setAttribute('aria-modal', 'true');
    d.innerHTML = '<div class="box">' +
      '<h3>' + title + '</h3>' +
      '<p>' + A.util.esc(set.title) + '　' + (function () {
        var it = set.items ? set.items.length : 0, pv = set.preview ? set.preview.length : 0, th = set.theorems ? set.theorems.length : 0;
        if (it) return '共 ' + it + ' 题';
        return '共 ' + pv + ' 道预习题 · ' + th + ' 张定理卡';
      })() + '</p>' +
      '<label class="chk" style="display:flex;margin-bottom:10px"><input type="checkbox" id="expAns"> 包含答案与解析（不勾选则得到空白卷）</label>' +
      '<label class="chk" style="display:flex;margin-bottom:10px"><input type="checkbox" id="expBlank" checked> 每题下方留出作答空白</label>' +
      '<p style="font-size:12.5px;color:#6b7a93;line-height:1.8;margin:0 0 14px">' +
      '点「下载 PDF」后会打开系统的保存窗口：把「目标 / 打印机」选成「<b>另存为 PDF</b>」即可存成 PDF 文件。</p>' +
      '<div class="row"><span class="spacer"></span>' +
      '<button class="btn" data-act="modalclose">取消</button>' +
      '<button class="btn primary" data-act="expdo" data-kind="pdf">下载 PDF</button>' +
      '</div></div>';
    d.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'modalclose') closeModal();
      if (b.dataset.act === 'expdo') {
        var ans = d.querySelector('#expAns');
        var blank = d.querySelector('#expBlank');
        var opt = { withAnswers: !!(ans && ans.checked), writing: !!(blank && blank.checked) };
        closeModal();
        var s = A.currentSet();
        A.doPrint(s, opt);
      }
    });
    document.body.appendChild(d);
    modalEl = d;
    focusIn(d);
  }

  /* ---------------- 事件 ---------------- */
  function bind() {
    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el) return;
      var act = el.dataset.act;
      var key = el.dataset.key;

      switch (act) {
        case 'nav': go(el.dataset.view); break;
        case 'go': go(el.dataset.view); break;
        case 'togchap': {
          var ch = el.dataset.ch;
          openChs[ch] = !openChs[ch];
          var box = el.closest('.chap');
          if (box) box.classList.toggle('open', openChs[ch]);
          break;
        }
        case 'gosec': go('section', { sec: el.dataset.sec, mode: el.dataset.mode || 'draw3' }); break;
        case 'redrawsec': go('section', { sec: el.dataset.sec, mode: 'draw3' }); break;
        case 'gotest': {
          var chn = el.dataset.ch;
          var tr0 = A.state().testRun;
          if (tr0 && tr0.ch !== String(chn)) {
            /* 已交卷但没保存的成绩同样不能静默覆盖 */
            var msg = tr0.reveal
              ? '第 ' + tr0.ch + ' 章的测试<b>已交卷但成绩还没保存</b>。现在开第 ' + chn + ' 章的测试会丢掉这次成绩。'
                + '<br><br>想保住成绩：取消 → 点页面顶部横幅的「去保存成绩」。'
              : '还有一份第 ' + tr0.ch + ' 章的测试没交卷，开新测试会覆盖它。确定吗？';
            confirmBox(msg, function () {
              go('test', { ch: chn, fresh: true });
            });
          } else {
            go('test', { ch: chn });
          }
          break;
        }
        case 'testrestart': {
          var tr1 = A.state().testRun;
          var useCh = tr1 ? tr1.ch : (cur.params && cur.params.ch);
          confirmBox('放弃当前这份测试，重新生成一套新题？', function () {
            A.startTest(useCh);
            go('test', { ch: useCh });
            toast('已重新开始测试');
          });
          break;
        }
        case 'testabandon': {
          var trA = A.state().testRun;
          var msgA = (trA && trA.reveal)
            ? '这份测试<b>已交卷但成绩没保存</b>，丢弃后这次的做对/做错将不会进入成绩表（错题标记本身会保留）。确定丢弃？'
            : '放弃这份没交卷的章节测试？（进度会丢弃）';
          confirmBox(msgA, function () {
            A.state().testRun = null;
            A.save();
            go('browse');
            toast(trA && trA.reveal ? '已丢弃已交卷的记录' : '已放弃');
          });
          break;
        }
        case 'unfixall': {
          confirmBox('清空「已订正」名单？（题目与答题记录不受影响）', function () {
            A.state().fixed = {};
            A.save();
            go('wrong');
            toast('已清空订正名单');
          });
          break;
        }
        case 'dosearch': {
          var box0 = mainEl.querySelector('[data-act="searchinput"]');
          go('search', { q: box0 ? box0.value : '' });
          break;
        }
        case 'searchtag': go('search', { q: el.dataset.tag }); break;
        case 'redraw': {
          A.state().batch = (A.state().batch || 0) + 1;
          A.resetTodayKeys();
          go('today');
          toast('换了一批题');
          break;
        }
        case 'mark': markKey(key, el.dataset.v, el); break;
        case 'star': {
          A.toggleStar(key);
          var art = articleOf(key);
          if (art) art.classList.toggle('starred', !!A.state().stars[key]);
          el.classList.toggle('on', !!A.state().stars[key]);
          if (el.classList.contains('on')) el.classList.add('star');
          break;
        }
        case 'sol': toggleSol(el); break;
        case 'thmtoggle': {
          var box = el.parentNode.querySelector('.thmhint');
          if (!box) break;
          if (box.hasAttribute('hidden')) { box.removeAttribute('hidden'); el.textContent = '收起对照'; }
          else { box.setAttribute('hidden', ''); el.textContent = el.textContent.indexOf('例') >= 0 ? '自己举一个例子再对照' : '先自己想，再点开对照'; }
          break;
        }
        case 'goprev': go('preview', { sec: el.dataset.sec }); break;
        case 'solall': toggleSolAll(); break;
        case 'checkin': {
          var k = A.util.todayKey();
          if (!A.state().daily[k]) A.state().daily[k] = { keys: [], done: false };
          A.state().daily[k].done = true;
          A.save();
          go('today');
          toast('打卡成功！连续 ' + A.streakDays() + ' 天');
          break;
        }
        case 'submit': {
          var run = A.state().testRun;
          if (!run) { toast('测试尚未开始'); break; }
          if (run.reveal) { A.startTest(run.ch); go('test', { ch: run.ch }); toast('已重新开始测试'); break; }
          run.reveal = true;
          run.submitTs = Date.now();
          A.save();
          go('test', { ch: run.ch });
          toast('答案已展开，请逐题自评后「保存成绩」');
          break;
        }
        case 'fixedall': go('wrong', { allfixed: true }); break;
        case 'fixedfold': go('wrong', {}); break;
        case 'finishtest': {
          var r = A.state().testRun;
          if (!r) break;
          var ok = 0, bad = 0;
          r.keys.forEach(function (kk) {
            var s = A.util.st(kk);
            if (s === 'ok') ok++;
            if (s === 'bad') bad++;
          });
          A.state().tests.push({ ch: r.ch, ts: Date.now(), n: r.keys.length, ok: ok, bad: bad });
          A.state().testRun = null;
          A.save();
          go('browse');
          toast('已保存成绩：做对 ' + ok + ' / ' + r.keys.length);
          break;
        }
        case 'quizgen': {
          var res = A.genQuiz();
          if (res.err) { toast(res.err); break; }
          go('quizrun');
          break;
        }
        case 'quizagain': {
          var res2 = A.genQuiz();
          if (res2.err) { toast(res2.err); break; }
          go('quizrun');
          break;
        }
        case 'quizselall': {
          var all = [];
          A.chapters.forEach(function (c) { c.sections.forEach(function (s) { all.push(s.num); }); });
          A.state().lastSel = all;
          A.save();
          go('quizsetup');
          break;
        }
        case 'quizselnone': {
          A.state().lastSel = [];
          A.save();
          go('quizsetup');
          break;
        }
        case 'export': exportModal(); break;
        case 'modalclose': closeModal(); break;
        case 'backup': {
          A.download('高等代数-学习记录备份-' + A.util.todayKey() + '.json',
            JSON.stringify(A.state(), null, 2), 'application/json');
          toast('备份已导出');
          break;
        }
        case 'clearwrong': {
          confirmBox('清空所有「做错」标记？收藏的题不受影响。', function () {
            var s = A.state();
            Object.keys(s.rec).forEach(function (k) { if (s.rec[k].st === 'bad') delete s.rec[k]; });
            A.save();
            go('wrong');
          });
          break;
        }
        case 'reset': {
          confirmBox('清空全部学习记录（做题状态、打卡、成绩）？题目不会受影响。', function () {
            A.reset();
            go('stats');
            toast('已清空');
          });
          break;
        }
        case 'toggleTree': sideEl.classList.toggle('open'); break;

        /* ---- 进入页 / 学习会话 ---- */
        case 'startstudy': startStudy('today'); break;
        case 'reviewwrong': startStudy('wrong'); break;
        case 'endstudy': endStudy(); break;

        /* ---- 刷教材 ---- */
        case 'gotb': go('tbsec', { sec: el.dataset.sec }); break;

        /* ---- 选择填空 ---- */
        case 'gocf': go('cfsec', { sec: el.dataset.sec }); break;
        case 'cfpick': {
          var r1 = A.cfAnswer(key, el.dataset.pick);
          if (!r1) break;
          var num1 = (key.split('#')[0] || '').replace(/^CF/, '');
          go('cfsec', { sec: num1 });
          if (r1.right) toast('答对了 ✓'); else toast('答错了，看看解析');
          break;
        }
        case 'cfshow': {
          var r2 = A.cfAnswer(key, '看答案');
          var num2 = (key.split('#')[0] || '').replace(/^CF/, '');
          go('cfsec', { sec: num2 });
          break;
        }

        /* ---- 草稿区 ---- */
        case 'scrathtoggle': toggleScratch(); break;
        case 'scratchpen': {
          scratchPen.color = el.dataset.color || '#16203a';
          var btns = scratchEl ? scratchEl.querySelectorAll('[data-act="scratchpen"]') : [];
          for (var bi = 0; bi < btns.length; bi++) btns[bi].classList.toggle('primary', btns[bi] === el);
          break;
        }
        case 'scratchundo': if (strokes.length) { strokes.pop(); scratchReplay(); } break;
        case 'scratchclear': strokes = []; scratchReplay(); break;
      }
    });

    document.addEventListener('change', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el) return;
      var act = el.dataset.act;
      if (act === 'scope') {
        A.state().scope = el.value;
        A.resetTodayKeys();
        go('today');
      } else if (act === 'skipok') {
        A.state().skipOk = !!el.checked;
        A.save();
        go(cur.view, cur.params);
        toast(el.checked ? '已开启：不再抽到做对过的题' : '已允许重复抽到做对过的题');
      } else if (act === 'searchopt') {
        if (el.dataset.k === 'undone') A.state().searchUndone = !!el.checked;
        if (el.dataset.k === 'wrong') A.state().searchWrong = !!el.checked;
        A.save();
        go('search', { q: A.state().searchQ || '' });
      } else if (act === 'quizn') {
        A.state().quizN = +el.value;
        A.save();
      } else if (act === 'quizsec') {
        var sel = A.state().lastSel.slice();
        var i = sel.indexOf(el.value);
        if (el.checked && i < 0) sel.push(el.value);
        if (!el.checked && i >= 0) sel.splice(i, 1);
        A.state().lastSel = sel;
        A.save();
      } else if (act === 'quizch') {
        var ch = el.dataset.ch;
        var nums = [];
        A.chapters.forEach(function (c) {
          if (c.num === ch) c.sections.forEach(function (s) { nums.push(s.num); });
        });
        var set = {};
        A.state().lastSel.forEach(function (n) { set[n] = 1; });
        nums.forEach(function (n) { if (el.checked) set[n] = 1; else delete set[n]; });
        A.state().lastSel = Object.keys(set);
        A.save();
        go('quizsetup');
      } else if (act === 'restore') {
        var f = el.files && el.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          var obj = null;
          try { obj = JSON.parse(String(reader.result)); } catch (err) { toast('导入失败：不是合法的 JSON 文件'); return; }
          var r = A.importState(obj);
          if (!r.ok) { toast('导入失败：' + r.err); return; }
          go('stats');
          toast('导入成功：有效记录 ' + Object.keys(A.state().rec).length + ' 条' +
            (r.repaired ? '，修复 ' + r.repaired + ' 处' : '') +
            (r.dropped ? '，忽略 ' + r.dropped + ' 条无效数据' : ''));
        };
        reader.readAsText(f);
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeModal(); return; }
      if (e.key === 'Enter') {
        var inp = e.target && e.target.closest ? e.target.closest('[data-act="searchinput"]') : null;
        if (inp) { e.preventDefault(); go('search', { q: inp.value }); }
      }
    });
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    mainEl = $('main');
    treeEl = $('tree');
    sideEl = $('side');
    toastEl = $('toast');
    A.init();
    /* 默认展开正在学的章：取第一个还没做完的章的上一章 */
    var firstOpen = null;
    for (var i = 0; i < A.chapters.length; i++) {
      var ch = A.chapters[i];
      var c = A.util.countsOfChapter(ch);
      if (c.done < c.total) { firstOpen = ch.num; break; }
    }
    A.chapters.forEach(function (ch) {
      openChs[ch.num] = (ch.num === (firstOpen || A.chapters[0].num));
    });
    buildTree();
    buildScratch();
    bind();
    ensureTicker();
    updateStudyChip();
    /* 进入网页先给前置操作（复盘错题 / 开始今日学习） */
    go('home');
    /* 章节测试计时器（交卷后冻结，不再继续走表） */
    setInterval(function () {
      if (cur.view !== 'test') return;
      var t = mainEl.querySelector('.timer');
      var run = A.state().testRun;
      if (!t || !run) return;
      if (run.reveal || t.getAttribute('data-frozen') === '1') return;
      var secs = Math.max(0, Math.floor((Date.now() - run.ts) / 1000));
      t.textContent = A.util.fmtDur(secs);
      t.classList.toggle('danger', secs > 90 * 60);
    }, 1000);

    /* 有一份没保存的测试就拦一下刷新/关页，别让成绩静默丢掉 */
    global.addEventListener('beforeunload', function (e) {
      var run = A.state() && A.state().testRun;
      if (!run) return;
      e.preventDefault();
      e.returnValue = '有一份章节测试还没保存成绩，确定离开？';
      return e.returnValue;
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
