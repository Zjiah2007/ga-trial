\\mathscr{A}$ 在 $\\varepsilon'$ 下的矩阵是（ ）","options":["A. $PAP^{-1}$","B. $P^{-1}AP$","C. $P^{\\top}AP$","D. $PA$"],"a":"B","s":"坐标满足 $X=PX'$，由 $Y=AX$ 得 $Y'=P^{-1}Y=P^{-1}APX'$，故新矩阵为 $P^{-1}AP$。"},{"type":"填空","k":"相抵与相似","q":"设 $A,B \\in \\mathbb{F}^{m \\times n}$，若存在可逆矩阵 $P,Q$ 使 $B=PAQ$，则称 $A$ 与 $B$ ____（填“相抵”或“相似”）。","options":[],"a":"相抵","s":"左乘、右乘可逆矩阵是相抵（等价）关系，它恰好刻画“同一个线性映射在不同基对下的表示矩阵”；相似只对同阶方阵有定义且要求 $P,Q$ 互逆。"}]},"6.7":{"num":"6.7","title":"线性映射的像与核","items":[{"type":"选择","k":"维数公式","q":"设 $V,U$ 是有限维线性空间，$\\phi: V \\to U$ 是线性映射，则下列等式成立的是（ ）","options":["A. $\\dim V=\\dim \\operatorname{Ker} \\phi+\\dim \\operatorname{Im} \\phi$","B. $\\dim V=\\dim \\operatorname{Ker} \\phi+\\dim U$","C. $\\dim U=\\dim \\operatorname{Ker} \\phi+\\dim \\operatorname{Im} \\phi$","D. $\\dim \\operatorname{Ker} \\phi=\\dim \\operatorname{Im} \\phi$"],"a":"A","s":"维数公式为 $\\dim V=\\dim\\operatorname{Ker}\\phi+\\dim\\operatorname{Im}\\phi$，注意左边用的是出发空间 $V$ 的维数，不是 $U$ 的。"},{"type":"填空","k":"单射的判据","q":"设 $\\phi: V \\to U$ 是线性映射，则 $\\phi$ 是单射当且仅当 $\\operatorname{Ker} \\phi=$ ____。","options":[],"a":"$\\{0\\}$","s":"$\\phi(\\alpha)=\\phi(\\beta)\\iff\\alpha-\\beta\\in\\operatorname{Ker}\\phi$，故核只含零向量时不同向量的像不同，$\\phi$ 单射。"},{"type":"选择","k":"由矩阵的秩求核的维数","q":"设 $\\phi: \\mathbb{F}^{3}\\to\\mathbb{F}^{3}$ 在标准基下的表示矩阵的秩为 $2$，则 $\\dim \\operatorname{Ker} \\phi=$（ ）","options":["A. $0$","B. $1$","C. $2$","D. $3$"],"a":"B","s":"由维数公式 $\\dim\\operatorname{Ker}\\phi=3-r(A)=3-2=1$。"},{"type":"选择","k":"非零线性函数的核","q":"设 $\\phi: \\mathbb{F}^{n}\\to\\mathbb{F}$ 是非零线性函数，则 $\\dim \\operatorname{Ker} \\phi=$（ ）","options":["A. $0$","B. $1$","C. $n-1$","D. $n$"],"a":"C","s":"非零线性函数的像为整个 $\\mathbb{F}$（维数 $1$），由维数公式 $\\dim\\operatorname{Ker}\\phi=n-1$。"}]},"6.8":{"num":"6.8","title":"商空间与线性映射的结构","items":[{"type":"选择","k":"商空间的元素","q":"设 $W$ 是线性空间 $V$ 的子空间，则商空间 $V/W$ 中的元素是（ ）","options":["A. $V$ 中的向量","B. $W$ 中的向量","C. 形如 $\\alpha+W$ 的陪集（同余类）","D. 数域 $\\mathbb{F}$ 中的数"],"a":"C","s":"$V/W=\\{\\alpha+W\\mid\\alpha\\in V\\}$，其中的元素是陪集而不是向量，故 $\\alpha+W=\\beta+W$ 与 $\\alpha=\\beta$ 并不等价。"},{"type":"填空","k":"商空间的维数","q":"设 $W$ 是有限维线性空间 $V$ 的子空间，$\\dim V=7$，$\\dim W=3$，则 $\\dim (V/W)=$ ____。","options":[],"a":"$4$","s":"$\\dim(V/W)=\\dim V-\\dim W=7-3=4$。"},{"type":"选择","k":"第一同构定理","q":"设 $\\phi: V \\to U$ 是线性映射，则商空间 $V/\\operatorname{Ker} \\phi$ 同构于（ ）","options":["A. $V$","B. $\\operatorname{Ker} \\phi$","C. $\\operatorname{Im} \\phi$","D. $U/\\operatorname{Im} \\phi$"],"a":"C","s":"第一同构定理：$V/\\operatorname{Ker}\\phi\\cong\\operatorname{Im}\\phi$，同构映射为 $\\alpha+\\operatorname{Ker}\\phi\\mapsto\\phi(\\alpha)$，它由 $\\phi$ 唯一确定。"},{"type":"选择","k":"商空间为零的条件","q":"设 $W$ 是有限维线性空间 $V$ 的子空间，则 $\\dim (V/W)=0$ 当且仅当（ ）","options":["A. $W=\\{0\\}$","B. $W=V$","C. $\\dim V=0$","D. $W$ 是 $V$ 的真子空间"],"a":"B","s":"$\\dim(V/W)=\\dim V-\\dim W=0\\iff\\dim W=\\dim V\\iff W=V$（子空间维数相同则相等）。"}]},"7.1":{"num":"7.1","title":"线性变换与矩阵相似","items":[{"type":"选择","k":"相似的几何含义","q":"设 $A,B$ 为 $n$ 阶方阵，下列条件中能推出 $A\\sim B$ 的是（ ）","options":["A. $r(A)=r(B)$","B. $\\operatorname{tr}A=\\operatorname{tr}B$ 且 $\\det A=\\det B$","C. 存在 $n$ 维空间的两组基 $\\varepsilon$ 与 $\\varepsilon'$，使 $A,B$ 是同一个线性变换分别在 $\\varepsilon,\\varepsilon'$ 下的矩阵","D. $A,B$ 的特征值（计重数）完全相同"],"a":"C","s":"相似就是“同一个线性变换在两组不同基下的矩阵”；秩、迹、行列式、特征值都只是相似不变量，反过来推不出相似。"},{"type":"选择","k":"相似的运算封闭性","q":"设 $A\\sim B$，则下列矩阵对一定相似的是（ ）","options":["A. $A$ 与 $A^{-1}$","B. $A^T$ 与 $B^T$","C. $A$ 与 $A^2$","D. $A$ 与 $A+E$"],"a":"B","s":"由 $B=P^{-1}AP$ 得 $B^T=P^TA^T(P^{-1})^T$，而 $(P^{-1})^T=(P^T)^{-1}$，两边整理得 $A^T=(P^T)^{-1}B^T P^T$，故 $A^T\\sim B^T$；A、C、D 都不能由 $A\\sim B$ 保证。"},{"type":"填空","k":"相似与幂","q":"设 $A\\sim B$，且 $B=\\begin{pmatrix}1&0\\\\0&2\\end{pmatrix}$，则 $\\operatorname{tr}(A^2)=$ ____","options":[],"a":"$5$","s":"$A\\sim B$ 推出 $A^2\\sim B^2$，而迹是相似不变量，故 $\\operatorname{tr}(A^2)=\\operatorname{tr}(B^2)=1^2+2^2=5$。"},{"type":"填空","k":"换基求表示矩阵","q":"设 $\\phi$ 在基 $(\\varepsilon_1,\\varepsilon_2)$ 下的矩阵为 $\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$，则 $\\phi$ 在基 $(\\varepsilon_2,\\varepsilon_1)$ 下的矩阵为 ____","options":[],"a":"$\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$","s":"$\\phi(\\varepsilon_2)=\\varepsilon_1$、$\\phi(\\varepsilon_1)=\\varepsilon_2$，新基下两列仍为 $(0,1)^T$ 与 $(1,0)^T$，故矩阵与原矩阵相同。"}]},"7.10":{"num":"7.10","title":"Frobenius 标准型和广义 Jordan 标准型","items":[{"type":"选择","k":"Frobenius 块的极小多项式","q":"设 $F(f)$ 是首一多项式 $f(\\lambda)$（次数 $r\\ge1$）的 Frobenius 块，则 $F(f)$ 的极小多项式是（　）","options":["A. $1$","B. $\\lambda$","C. $f(\\lambda)$","D. $f(\\lambda)^{2}$"],"a":"C","s":"Frobenius 块的非常数不变因子只有一个 $f$，故特征多项式与极小多项式都等于 $f(\\lambda)$。"},{"type":"选择","k":"初等因子个数决定广义 Jordan 形的块数","q":"设 $A$ 的不变因子为 $1,1,\\lambda-1,(\\lambda-1)^2(\\lambda^2+1)$，则 $A$ 在 $\\mathbb{Q}$ 上的广义 Jordan 标准形由几个块组成（　）","options":["A. $2$","B. $3$","C. $4$","D. $5$"],"a":"B","s":"初等因子为 $\\lambda-1$、$(\\lambda-1)^2$、$\\lambda^2+1$，共 $3$ 个；$\\lambda^2+1$ 在 $\\mathbb{Q}$ 上不可约，不能再拆成两块。"},{"type":"填空","k":"由初等因子数 Jordan 块个数","q":"设 $A$ 的不变因子为 $1,(\\lambda-1)^2(\\lambda^2+1)$，则在 $\\mathbb{C}$ 上 $A$ 的 Jordan 标准形中属于特征值 $1$ 的块的个数为 ____","options":[],"a":"$1$","s":"初等因子为 $(\\lambda-1)^2$ 与 $\\lambda^2+1$，属于 $1$ 的只有 $(\\lambda-1)^2$，故只有一个 $2$ 阶块 $J_2(1)$。"},{"type":"选择","k":"Frobenius 块与 Jordan 块的关系","q":"设 $A$ 的不变因子为 $1,(\\lambda-1)^3$，则 $A$ 的 Frobenius 块 $F((\\lambda-1)^3)$ 与 Jordan 块 $J_3(1)$（　）","options":["A. 相等","B. 相似但不相等","C. 相抵但不相似","D. 既不相抵也不相似"],"a":"B","s":"两者的特征矩阵有相同的不变因子 $1,(\\lambda-1)^3$，故相似；但 $F((\\lambda-1)^3)=\\begin{pmatrix}0&0&1\\\\1&0&-3\\\\0&1&3\\end{pmatrix}\\ne J_3(1)$。"}]},"7.2":{"num":"7.2","title":"不变子空间","items":[{"type":"选择","k":"不变子空间的运算","q":"设 $W_1,W_2$ 都是 $V$ 上线性变换 $\\varphi$ 的不变子空间，则下列集合一定也是 $\\varphi$-不变子空间的是（ ）","options":["A. $W_1\\cup W_2$","B. $W_1\\cap W_2$","C. $W_1$ 的任一个补子空间 $W$（即 $V=W_1\\oplus W$）","D. $(V\\setminus W_1)\\cup\\{0\\}$"],"a":"B","s":"交与和都不变；并集一般不是子空间，补空间一般也不变（要它也不变才能把矩阵化成分块对角）。"},{"type":"选择","k":"一维不变子空间的刻画","q":"设 $\\alpha\\ne0$，则一维子空间 $\\langle\\alpha\\rangle$ 是 $\\varphi$-不变子空间的充分必要条件是（ ）","options":["A. $\\varphi(\\alpha)=0$","B. $\\alpha$ 是 $\\varphi$ 的特征向量","C. $\\varphi(\\alpha)$ 与 $\\alpha$ 线性无关","D. $\\alpha\\in\\operatorname{Im}\\varphi$"],"a":"B","s":"不变等价于 $\\varphi(\\alpha)=\\lambda\\alpha$，即 $\\alpha$ 是特征向量（$\\lambda$ 须在所在数域内）；A 只是 $\\lambda=0$ 的特殊情形。"},{"type":"填空","k":"判定不变子空间","q":"设 $\\varphi$ 在基 $\\xi_1,\\xi_2,\\xi_3$ 下的矩阵为 $\\begin{pmatrix}1&2&0\\\\0&3&0\\\\0&0&4\\end{pmatrix}$，则一维子空间 $\\langle\\xi_2\\rangle$ ____（填“是”或“不是”）$\\varphi$-不变子空间。","options":[],"a":"不是","s":"矩阵第二列为 $(2,3,0)^T$，即 $\\varphi(\\xi_2)=2\\xi_1+3\\xi_2\\notin\\langle\\xi_2\\rangle$，故不是不变子空间。"},{"type":"填空","k":"不变子空间与分块上三角","q":"设 $W$ 是 $\\varphi$-不变子空间，$\\dim W=k$，取 $W$ 的基 $\\eta_1,\\dots,\\eta_k$ 并扩充为 $V$ 的基 $\\eta_1,\\dots,\\eta_n$，则 $\\varphi$ 在这组基下的矩阵呈 ____ 形，其左上角 $k$ 阶块是 ____ 的矩阵。","options":[],"a":"分块上三角 $\\begin{pmatrix}B&C\\\\0&D\\end{pmatrix}$；左上角块 $B$ 是限制变换 $\\varphi|_W$ 的矩阵","s":"$W$ 不变使前 $k$ 列的像仍在前 $k$ 个基向量张成的空间里，故左下块为零；前 $k$ 列的前 $k$ 个分量正是 $\\varphi|_W$ 在该基下的矩阵。"}]},"7.3":{"num":"7.3","title":"特征值与特征向量","items":[{"type":"选择","k":"对合矩阵的特征值","q":"设 $n$ 阶方阵 $A$ 满足 $A^2=E$，则 $A$ 在数域 $\\mathbb{F}$ 上的特征值只可能是（ ）","options":["A. $1$ 或 $-1$","B. $0$ 或 $1$","C. 只能是 $0$","D. 只能是 $1$"],"a":"A","s":"由 $A\\alpha=\\lambda\\alpha$（$\\alpha\\ne0$）得 $\\lambda^2=1$，故 $\\lambda=\\pm1$；若条件换成 $A^2=0$，则只能取 $\\lambda=0$。"},{"type":"选择","k":"特征值与特征向量的基本性质","q":"关于特征值与特征向量，下列说法正确的是（ ）","options":["A. 零向量是任意方阵的特征向量","B. 不同特征值对应的特征向量必线性无关","C. 同一特征值对应的任意两个特征向量必线性相关","D. 若 $A$ 的特征值全为 $0$，则 $A=0$"],"a":"B","s":"定义要求特征向量非零；同一特征值的特征向量可以线性无关（如 $I_2$）；特征值全为 $0$ 的矩阵可能是 $\\begin{pmatrix}0&1\\\\0&0\\end{pmatrix}\\ne0$。"},{"type":"填空","k":"多项式矩阵的行列式","q":"设 $3$ 阶矩阵 $A$ 的特征值为 $1,-1,2$，则 $\\det(A^2+E)=$ ____","options":[],"a":"$20$","s":"$A^2+E$ 的特征值为 $1^2+1=2$、$(-1)^2+1=2$、$2^2+1=5$，故行列式为三者之积 $2\\cdot2\\cdot5=20$。"},{"type":"填空","k":"特征值的多项式与迹","q":"设 $3$ 阶矩阵 $A$ 的特征值为 $1,2,2$，则 $\\operatorname{tr}(A^2-3A+E)=$ ____","options":[],"a":"$-3$","s":"取 $f(x)=x^2-3x+1$，则 $A^2-3A+E$ 的特征值为 $f(1)=-1$、$f(2)=-1$、$f(2)=-1$，迹为 $(-1)+(-1)+(-1)=-3$。"}]},"7.4":{"num":"7.4","title":"可对角化","items":[{"type":"选择","k":"可对角化的充分条件","q":"设 $A$ 是数域 $\\mathbb{F}$ 上的 $n$ 阶矩阵，下列条件中不能保证 $A$ 可对角化的是（　）","options":["A. $A$ 有 $n$ 个互不相同的特征值，且都在 $\\mathbb{F}$ 中","B. 存在无重根的多项式 $f(x)\\in\\mathbb{F}[x]$ 使 $f(A)=0$","C. $A^{2}=A$","D. $A$ 是幂零矩阵"],"a":"D","s":"$n$ 个互异特征值、无重根零化多项式都保证可对角化；$A^{2}=A$ 时 $m_A\\mid\\lambda(\\lambda-1)$ 也可对角化。幂零矩阵除零矩阵外都不可对角化，如 $\\begin{pmatrix}0&1\\\\0&0\\end{pmatrix}$。"},{"type":"选择","k":"有重特征值时的判定","q":"若 $n$ 阶矩阵 $A$ 有重特征值，则（　）","options":["A. $A$ 一定不可对角化","B. $A$ 一定可对角化","C. $A$ 可能可对角化，也可能不可对角化","D. $A$ 的特征值必不全在 $\\mathbb{F}$ 中"],"a":"C","s":"重特征值本身不妨碍对角化：$A=E$ 有重特征值却已是对角矩阵；而 $\\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$ 有重特征值且不可对角化。"},{"type":"填空","k":"几何重数与秩","q":"设 $A$ 是 $3$ 阶矩阵，特征值为 $1,1,2$。若 $A$ 不可对角化，则 $r(A-E)=$ ____ 。","options":[],"a":"$2$","s":"不可对角化说明 $\\dim V_{1}<2$，而 $1$ 是特征值故 $\\dim V_{1}\\ge1$，于是 $\\dim V_{1}=1$，$r(A-E)=3-1=2$。"},{"type":"填空","k":"用对角化求迹","q":"若 $A$ 相似于 $\\operatorname{diag}(1,1,10)$，则 $\\operatorname{tr}(A^{n})=$ ____ 。","options":[],"a":"$10^{n}+2$","s":"相似矩阵的幂仍相似，迹不变，故 $\\operatorname{tr}(A^{n})=\\operatorname{tr}(\\operatorname{diag}(1,1,10^{n}))=10^{n}+2$。"}]},"7.5":{"num":"7.5","title":"零化多项式","items":[{"type":"选择","k":"极小多项式刻画可对角化","q":"设 $A$ 是数域 $\\mathbb{F}$ 上的 $n$ 阶矩阵，$m_A(\\lambda)$ 是其极小多项式，则 $A$ 可对角化的充要条件是（　）","options":["A. $m_A(\\lambda)$ 可分解为 $\\mathbb{F}$ 中互不相同的一次因式之积","B. $m_A(\\lambda)$ 的次数等于 $n$","C. $\\det A\\ne0$","D. $|\\lambda E-A|$ 无重根"],"a":"A","s":"极小多项式在 $\\mathbb{F}$ 上分解为互异一次因式之积等价于可对角化。D 只是充分条件：$\\operatorname{diag}(2,2,3)$ 可对角化但 $|\\lambda E-A|$ 有重根；B 是特征多项式的性质；C 与可对角化无关。"},{"type":"填空","k":"分块对角矩阵的极小多项式","q":"设 $A=\\operatorname{diag}(2,2,3)$，则 $m_A(\\lambda)=$ ____ 。","options":[],"a":"$(\\lambda-2)(\\lambda-3)$","s":"分块对角矩阵的极小多项式是各块极小多项式的最小公倍式，$\\operatorname{lcm}(\\lambda-2,\\lambda-3)=(\\lambda-2)(\\lambda-3)$。"},{"type":"选择","k":"无重根零化多项式","q":"设 $A$ 是复 $n$ 阶矩阵，且 $A^{3}=A$，则（　）","options":["A. $A$ 可对角化，特征值只能是 $0,1,-1$","B. $A$ 一定是幂零矩阵","C. $A$ 的特征值只能是 $0$","D. $A$ 一定不可对角化"],"a":"A","s":"$A^{3}-A=0$，得 $m_A\\mid\\lambda(\\lambda-1)(\\lambda+1)$ 无重根，故可对角化，特征值是 $\\lambda^{3}-\\lambda$ 的根。"},{"type":"填空","k":"极小多项式含重根则不可对角化","q":"设 $A=\\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$，则 $m_A(\\lambda)=$ ____ 。","options":[],"a":"$(\\lambda-1)^{2}$","s":"$A-E=\\begin{pmatrix}0&1\\\\0&0\\end{pmatrix}\\ne0$ 而 $(A-E)^{2}=0$，故极小多项式为 $(\\lambda-1)^{2}$；它含重根，$A$ 不可对角化。"}]},"7.6":{"num":"7.6","title":"$\\lambda$-矩阵相抵与矩阵相似","items":[{"type":"选择","k":"$\\lambda$-矩阵可逆的判定","q":"设 $A(\\lambda)$ 是 $n$ 阶 $\\lambda$-矩阵，则 $A(\\lambda)$ 可逆的充要条件是（　）","options":["A. $|A(\\lambda)|$ 是非零常数","B. $|A(\\lambda)|$ 是非零多项式","C. $r(A(\\lambda))=n$","D. $A(\\lambda)$ 的元素全是非零常数"],"a":"A","s":"可逆指存在 $\\lambda$-矩阵 $B(\\lambda)$ 使 $A(\\lambda)B(\\lambda)=E$，两边取行列式知 $|A(\\lambda)|$ 必须是非零常数；B、C 只保证满秩（如 $\\operatorname{diag}(\\lambda,1)$）。"},{"type":"填空","k":"非常数行列式导致不可逆","q":"设 $A(\\lambda)=\\operatorname{diag}(\\lambda,\\lambda,2)$，则 $A(\\lambda)$ 满秩但不可逆，因为 $|A(\\lambda)|=$ ____ 。","options":[],"a":"$2\\lambda^{2}$","s":"行列式 $2\\lambda^{2}$ 是非零多项式但不是非零常数，故 $A(\\lambda)$ 满秩（秩为 $3$）却不可逆。"},{"type":"选择","k":"相抵的定义","q":"两个 $n$ 阶 $\\lambda$-矩阵 $A(\\lambda)$ 与 $B(\\lambda)$ 相抵，是指（　）","options":["A. 存在可逆的 $\\lambda$-矩阵 $P(\\lambda),Q(\\lambda)$ 使 $B(\\lambda)=P(\\lambda)A(\\lambda)Q(\\lambda)$","B. 存在可逆的数字矩阵 $P,Q$ 使 $B(\\lambda)=PA(\\lambda)Q$","C. $|A(\\lambda)|$ 与 $|B(\\lambda)|$ 只相差一个非零常数倍","D. $A(\\lambda)$ 与 $B(\\lambda)$ 的秩相等"],"a":"A","s":"相抵即经若干次 $\\lambda$-矩阵的初等变换互化，等价于左右乘可逆的 $\\lambda$-矩阵；B 把所用矩阵限制为数字矩阵，太强；C、D 只是相抵的必要条件（同秩与相差常数倍），不充分。"},{"type":"填空","k":"相似与相抵的等价","q":"设 $A,B$ 是 $n$ 阶数字矩阵，若 $\\lambda E-A$ 与 $\\lambda E-B$ 相抵，则 $A$ 与 $B$ ____（填“相似”或“不相似”）。","options":[],"a":"相似","s":"$\\lambda E-A\\simeq\\lambda E-B$ 说明两者有相同的不变因子，从而特征矩阵的行列式因子相同，故 $A\\sim B$；反之相似时 $\\lambda E-A=P^{-1}(\\lambda E-B)P$ 也相抵。"}]},"7.7":{"num":"7.7","title":"$\\lambda$-矩阵的相抵标准型","items":[{"type":"选择","k":"Smith 标准形的整除链","q":"设 $d_1,d_2,\\cdots,d_r$ 是 $\\lambda$-矩阵 Smith 标准形中的非零对角元（均取首一），则它们一定满足（　）","options":["A. $d_2\\mid d_1\\mid\\cdots\\mid d_r$","B. $d_1\\mid d_2\\mid\\cdots\\mid d_r$","C. 两两互素","D. 每个 $d_i$ 都是不可约多项式"],"a":"B","s":"标准形要求对角元首一且依次整除（$d_i\\mid d_{i+1}$），整除链正是标准形唯一的原因；A 方向反了。"},{"type":"选择","k":"相似与特征矩阵相抵","q":"设 $A,B$ 是数域 $\\mathbb{F}$ 上的 $n$ 阶方阵，则 $A$ 相似于 $B$ 的充要条件是（　）","options":["A. $\\det A=\\det B$","B. $A,B$ 的特征值完全相同","C. $\\lambda E-A$ 与 $\\lambda E-B$ 相抵","D. $A^{T}$ 与 $B$ 相抵"],"a":"C","s":"相似 $\\iff$ 特征矩阵相抵（不变因子相同）；A、B 只是必要条件，例如 $E_2$ 与 $\\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$ 行列式、特征值都相同却不相似。"},{"type":"填空","k":"第 n 个行列式因子","q":"设 $A$ 是 $n$ 阶矩阵，$D_n(\\lambda)$ 是特征矩阵 $\\lambda E-A$ 的第 $n$ 个行列式因子，则 $D_n(\\lambda)=$ ____","options":[],"a":"$\\chi_A(\\lambda)=\\det(\\lambda E-A)$","s":"第 $n$ 阶行列式因子就是整个 $n$ 阶行列式，即特征多项式。"},{"type":"填空","k":"行列式因子与不变因子的换算","q":"设 $5$ 阶矩阵 $A$ 的不变因子为 $1,1,1,\\lambda+1,(\\lambda+1)(\\lambda-3)$，则 $D_4(\\lambda)=$ ____","options":[],"a":"$\\lambda+1$","s":"$D_k=d_1d_2\\cdots d_k$，故 $D_4=1\\cdot1\\cdot1\\cdot(\\lambda+1)=\\lambda+1$（$D_5$ 才是 $\\chi_A$）。"},{"type":"选择","k":"初等变换的合法性","q":"在化简 $\\lambda$-矩阵时，下列操作中不允许的是（　）","options":["A. 交换两行","B. 用非零常数乘某一行","C. 用 $\\lambda$ 乘某一行","D. 把某一行的 $\\lambda$-多项式倍加到另一行上"],"a":"C","s":"只允许乘非零常数。乘 $\\lambda$ 不是可逆变换，会把行列式因子乘上 $\\lambda$ 的幂，破坏整除链与标准形的唯一性。"}]},"7.8":{"num":"7.8","title":"初等因子组与 Jordan 标准型","items":[{"type":"选择","k":"初等因子与 Jordan 块的个数","q":"设 $A$ 的初等因子组为 $(\\lambda-1)^2,\\lambda-1,\\lambda+2$，则 $A$ 的 Jordan 标准形中属于特征值 $1$ 的块的个数为（　）","options":["A. $1$","B. $2$","C. $3$","D. $4$"],"a":"B","s":"初等因子 $(\\lambda-1)^2$ 与 $\\lambda-1$ 各对应一个属于 $1$ 的块，共 $2$ 个（阶数 $2+1$），$A$ 为 $4$ 阶。"},{"type":"选择","k":"由秩确定 Jordan 形","q":"设 $3$ 阶矩阵 $A$ 的特征多项式为 $(\\lambda-2)^3$，且 $r(A-2E)=1$，则 $A$ 的 Jordan 标准形为（　）","options":["A. $\\operatorname{diag}(J_3(2))$","B. $\\operatorname{diag}(J_2(2),2)$","C. $\\operatorname{diag}(2,2,2)$","D. $\\operatorname{diag}(J_2(0),0)$"],"a":"B","s":"属于 $2$ 的块数 $=3-r(A-2E)=2$，块阶数之和为 $3$，只能是 $2+1$，即 $J_2(2)$ 与 $(2)$。"},{"type":"填空","k":"幂等矩阵的 Jordan 形","q":"若 $3$ 阶矩阵 $A$ 满足 $A^2=A$ 且 $r(A)=1$，则 $A$ 的 Jordan 标准形为 ____","options":[],"a":"$\\operatorname{diag}(1,0,0)$","s":"幂等矩阵特征值只能是 $0,1$，极小多项式 $\\lambda(\\lambda-1)$ 无重根故可对角化；秩等于 $1$ 的个数，故对角线上恰有一个 $1$。"},{"type":"选择","k":"极小多项式加特征多项式判相似的阶数限制","q":"设 $A=\\operatorname{diag}(J_2(0),J_2(0))$，$B=\\operatorname{diag}(J_2(0),0,0)$，则（　）","options":["A. $A$ 相似于 $B$","B. $\\chi_A(\\lambda)\\ne\\chi_B(\\lambda)$","C. $m_A(\\lambda)=m_B(\\lambda)$ 但 $A$ 与 $B$ 不相似","D. $A^{T}$ 相似于 $B^{T}$"],"a":"C","s":"两者都有 $\\chi=\\lambda^4$、$m=\\lambda^2$，但 $r(A)=2\\ne1=r(B)$，不相似；可见“$m$ 与 $\\chi$ 相同即相似”只在 $3$ 阶及以下成立。"},{"type":"填空","k":"初等因子次数之和等于阶数","q":"若 $A$ 的初等因子组为 $\\lambda-1,(\\lambda-1)^3,(\\lambda-2)^2$，则 $A$ 的阶数为 ____","options":[],"a":"$6$","s":"初等因子次数之和等于矩阵阶数：$1+3+2=6$（等价于 $A\\sim\\operatorname{diag}(J_1(1),J_3(1),J_2(2))$）。"}]},"7.9":{"num":"7.9","title":"Jordan 标准型与空间分解","items":[{"type":"填空","k":"根子空间的维数","q":"设 $A$ 的 Jordan 标准形为 $\\operatorname{diag}(J_3(2),J_1(1))$，则属于特征值 $2$ 的根子空间维数为 ____","options":[],"a":"$3$","s":"根子空间维数等于该特征值的代数重数，即所有属于 $2$ 的 Jordan 块阶数之和 $3$。"},{"type":"选择","k":"根子空间都是循环子空间的条件","q":"设 $A$ 是复数域上 $n$ 阶矩阵，$\\phi:X\\mapsto AX$。则 $V$ 的每个根子空间都是循环子空间等价于（　）","options":["A. $A$ 可对角化","B. $\\chi_A(\\lambda)=m_A(\\lambda)$","C. $m_A(\\lambda)$ 无重根","D. $A$ 是幂零矩阵"],"a":"B","s":"根子空间循环 $\\iff$ 每个特征值只有一个 Jordan 块 $\\iff$ 第 $n$ 个行列式因子等于第 $n$ 个不变因子，即 $\\chi_A=m_A$；A、C 都比它强。"},{"type":"填空","k":"几何重数","q":"设 $A=\\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$，则 $\\dim\\ker(A-E)=$ ____","options":[],"a":"$1$","s":"$A-E=\\begin{pmatrix}0&1\\\\0&0\\end{pmatrix}$ 的秩为 $1$，故特征子空间维数为 $2-1=1$，而属于 $1$ 的根子空间维数是 $2$。"},{"type":"选择","k":"根子空间的直和分解","q":"设 $\\phi$ 是 $\\mathbb{C}$ 上 $n$ 维线性空间 $V$ 的线性变换，$\\lambda_1,\\cdots,\\lambda_t$ 是它的全部互异特征值。则下列一定成立的是（　）","options":["A. $V=\\bigoplus_{i=1}^{t}\\ker(\\phi-\\lambda_i{\\rm id})$","B. $V=\\bigoplus_{i=1}^{t}\\ker(\\phi-\\lambda_i{\\rm id})^{n}$","C. $\\phi$ 可对角化","D. $m_\\phi(\\lambda)$ 无重根"],"a":"B","s":"复域上根子空间总是直和分解出整个空间（Jordan 分解）；A 中的特征子空间直和一般只是 $V$ 的真子空间，除非 $\\phi$ 可对角化。"}]},"8.1":{"num":"8.1","title":"一般内积空间的定义和举例","items":[{"type":"选择","k":"内积的矩阵刻画","q":"设 $x,y\\in\\mathbb{R}^n$ 都是列向量，$G$ 为 $n$ 阶实矩阵。规定 $(x,y)=x^TGy$，则它成为 $\\mathbb{R}^n$ 上内积的充要条件是 ____","options":["A. $G$ 对称且正定","B. $G$ 可逆","C. $G$ 对称","D. $G$ 的对角元全为正"],"a":"A","s":"对称保证 $(x,y)=(y,x)$，正定保证 $x\\ne0$ 时 $x^TGx>0$；$G$ 可逆（如 $\\operatorname{diag}(1,-1)$）或对角元为正都不足以保证正定。"},{"type":"填空","k":"向量的长度","q":"在 $\\mathbb{R}^3$（标准内积）中，$\\alpha=(1,2,2)^T$，则 $\\|\\alpha\\|=$ ____","options":[],"a":"$3$","s":"$\\|\\alpha\\|=\\sqrt{1^2+2^2+2^2}=\\sqrt9=3$。"},{"type":"选择","k":"正交与勾股定理","q":"设 $V$ 是实内积空间，$\\alpha,\\beta\\in V$ 均非零。下列条件中与 $\\alpha\\perp\\beta$ 等价的是 ____","options":["A. $\\|\\alpha+\\beta\\|^2=\\|\\alpha\\|^2+\\|\\beta\\|^2$","B. $\\|\\alpha+\\beta\\|=\\|\\alpha\\|+\\|\\beta\\|$","C. $\\|\\alpha\\|=\\|\\beta\\|$","D. $\\|\\alpha+\\beta\\|=\\|\\alpha\\|$"],"a":"A","s":"$\\|\\alpha+\\beta\\|^2=\\|\\alpha\\|^2+\\|\\beta\\|^2+2(\\alpha,\\beta)$，等于右边当且仅当 $(\\alpha,\\beta)=0$；B 要求两向量同向，C、D 与正交无关。"},{"type":"填空","k":"函数空间中的内积","q":"在实内积空间 $C[-1,1]$ 上取内积 $(f,g)=\\int_{-1}^{1}f(x)g(x)\\,dx$，则 $(1,x)=$ ____","options":[],"a":"$0$","s":"$(1,x)=\\int_{-1}^{1}x\\,dx=0$，故常函数 $1$ 与函数 $x$ 正交。"}]},"8.2":{"num":"8.2","title":"标准正交基与内积空间同构","items":[{"type":"选择","k":"标准正交基之间的过渡矩阵","q":"设 $(\\xi_1,\\cdots,\\xi_n)$ 与 $(\\eta_1,\\cdots,\\eta_n)$ 都是 $n$ 维欧氏空间 $V$ 的标准正交基，且 $(\\eta_1,\\cdots,\\eta_n)=(\\xi_1,\\cdots,\\xi_n)P$，则 $P$ 一定是 ____","options":["A. 正交矩阵","B. 对称矩阵","C. 对角矩阵","D. 上三角矩阵"],"a":"A","s":"两组标准正交基的度量矩阵都是 $E$，由新度量矩阵公式得 $P^TEP=P^TP=E$，故 $P$ 是正交矩阵；它一般不对称、不对角、也不上三角。"},{"type":"填空","k":"Schmidt 正交化一步","q":"在 $\\mathbb{R}^3$（标准内积）中对 $\\alpha_1=(1,1,0)^T$、$\\alpha_2=(2,0,1)^T$ 作 Schmidt 正交化（不单位化），则 $\\beta_2=$ ____","options":[],"a":"$(1,-1,1)^T$","s":"$\\beta_2=\\alpha_2-\\frac{(\\alpha_2,\\alpha_1)}{(\\alpha_1,\\alpha_1)}\\alpha_1=(2,0,1)-(1,1,0)=(1,-1,1)^T$，其中 $(\\alpha_2,\\alpha_1)=2$、$(\\alpha_1,\\alpha_1)=2$，且 $(\\beta_2,\\alpha_1)=2-1=0$。"},{"type":"选择","k":"复向量的长度","q":"在 $\\mathbb{C}^2$（标准内积）中，$\\alpha=(1,\\mathrm{i})^T$，则 $\\|\\alpha\\|=$ ____","options":["A. $0$","B. $\\sqrt2$","C. $2$","D. $\\mathrm{i}$"],"a":"B","s":"$\\|\\alpha\\|^2=|1|^2+|\\mathrm{i}|^2=1+1=2$，故 $\\|\\alpha\\|=\\sqrt2$。复内积要取模的平方，写成 $1+\\mathrm{i}^2=0$ 是典型错误。"},{"type":"填空","k":"酉矩阵的列向量","q":"设 $U$ 是 $n$ 阶酉矩阵，则 $U$ 的 $n$ 个列向量构成 $\\mathbb{C}^n$（标准内积）的一组 ____","options":[],"a":"标准正交基","s":"$U^{\\rm H}U=E$ 的第 $(i,j)$ 元正是 $(u_i,u_j)$，故列向量两两正交且都是单位向量，$n$ 个线性无关的向量构成标准正交基。"}]},"8.3":{"num":"8.3","title":"酉矩阵、正交矩阵与标准型","items":[{"type":"填空","k":"酉矩阵特征值的模","q":"设 $U$ 是酉矩阵，$\\lambda$ 是 $U$ 的任一特征值，则 $|\\lambda|=$ ____","options":[],"a":"$1$","s":"由 $U\\xi=\\lambda\\xi$（$\\xi\\ne0$）与酉变换保长度得 $|\\lambda|\\,\\|\\xi\\|=\\|\\xi\\|$，故 $|\\lambda|=1$。"},{"type":"选择","k":"正交矩阵的特征值","q":"设 $A$ 是实正交矩阵，$\\lambda$ 是 $A$ 的（复）特征值，则 $\\lambda$ 一定满足 ____","options":["A. $\\lambda=\\pm1$","B. $|\\lambda|=1$","C. $\\lambda$ 为实数","D. $\\lambda=0$ 或 $|\\lambda|=1$"],"a":"B","s":"正交矩阵保长度，故 $|\\lambda|=1$；只有特征值恰好为实数时才必为 $\\pm1$，例如旋转矩阵的特征值是 $\\cos\\theta\\pm\\mathrm{i}\\sin\\theta$。"},{"type":"填空","k":"正交矩阵的逆","q":"设 $A$ 是 $n$ 阶实正交矩阵，则 $A^{-1}=$ ____","options":[],"a":"$A^T$","s":"由 $A^TA=E$ 直接得到 $A^{-1}=A^T$。因为 $A$ 的元素为实数，$A^{\\rm H}=A^T$，所以 $A^{-1}=A^{\\rm H}$ 也是正交矩阵，与“酉矩阵的逆是酉矩阵”是同一件事。"},{"type":"选择","k":"正交变换的基本性质","q":"设 $\\phi$ 是 $n$ 维欧氏空间 $V$ 上的正交变换，下列结论中不一定成立的是 ____","options":["A. $\\phi$ 保持内积","B. $\\phi$ 可逆且 $\\phi^{-1}$ 也是正交变换","C. $\\phi$ 在标准正交基下的矩阵是正交矩阵","D. $\\phi$ 的特征值全为实数"],"a":"D","s":"正交变换的特征值模为 $1$，除 $\\pm1$ 外还可能成对出现共轭复特征值（旋转），故不一定全为实数；A、B、C 都是正交变换的基本性质。"}]},"8.4":{"num":"8.4","title":"实对称矩阵和 Hermite 矩阵","items":[{"type":"选择","k":"Hermite 矩阵的乘法","q":"设 $A,B$ 都是 $n$ 阶 Hermite 矩阵，则下列矩阵一定也是 Hermite 矩阵的是 ____","options":["A. $AB$","B. $AB-BA$","C. $ABA$","D. $\\mathrm{i}AB$"],"a":"C","s":"$(ABA)^{\\rm H}=A^{\\rm H}B^{\\rm H}A^{\\rm H}=ABA$。$AB$ 需 $AB=BA$ 时才 Hermite；$AB-BA$ 是反 Hermite 矩阵，除零矩阵外都不 Hermite；取 $A=B=E$ 可见 $\\mathrm{i}AB=\\mathrm{i}E$ 不是 Hermite 矩阵。"},{"type":"填空","k":"实对称矩阵特征向量的正交性","q":"设 $A$ 是实对称矩阵，$\\xi,\\eta$ 分别是 $A$ 的属于不同特征值 $\\lambda\\ne\\mu$ 的特征向量，则 $\\xi$ 与 $\\eta$ ____（填“正交”或“不一定正交”）","options":[],"a":"正交","s":"$\\lambda(\\xi,\\eta)=(A\\xi,\\eta)=(\\xi,A\\eta)=\\mu(\\xi,\\eta)$，由 $\\lambda\\ne\\mu$ 得 $(\\xi,\\eta)=0$，所以必正交。"},{"type":"填空","k":"Hermite 二次型的取值","q":"设 $A$ 是 $n$ 阶 Hermite 矩阵，$x\\in\\mathbb{C}^n$，则 $x^{\\rm H}Ax$ 一定是 ____（填“实数”“纯虚数”或“一般复数”）","options":[],"a":"实数","s":"$\\overline{x^{\\rm H}Ax}=(x^{\\rm H}Ax)^{\\rm H}=x^{\\rm H}A^{\\rm H}x=x^{\\rm H}Ax$，与自身共轭相等，故为实数；实对称矩阵的 $x^TAx$ 同理。"},{"type":"选择","k":"正交相似不变量","q":"设 $A$ 是 $4$ 阶实对称矩阵，且 $A$ 正交相似于 $\\operatorname{diag}(1,1,-2,0)$，则关于 $A$ 的正确说法是 ____","options":["A. $A$ 正定","B. $A$ 的负惯性指数为 $1$，秩为 $3$","C. $\\det A=-2$","D. $A$ 半正定"],"a":"B","s":"正交相似不改变特征值，$A$ 的特征值为 $1,1,-2,0$，故正惯性指数为 $2$、负惯性指数为 $1$、$\\operatorname{rank}A=3$、$\\det A=0$，既不正定也不半正定。"}]},"8.5":{"num":"8.5","title":"奇异值分解——酉相抵标准型","items":[{"type":"填空","k":"非零奇异值的个数","q":"设 $A$ 是 $m\\times n$ 复矩阵，则 $A$ 的非零奇异值的个数等于 ____","options":[],"a":"$\\operatorname{rank}A$","s":"非零奇异值是 $A^{\\rm H}A$ 的非零特征值的算术平方根，而 $\\operatorname{rank}(A^{\\rm H}A)=\\operatorname{rank}A$，故个数等于 $A$ 的秩。"},{"type":"选择","k":"SVD 中 $\\Sigma$ 的形状","q":"设 $A$ 是 $m\\times n$ 复矩阵，$A=U\\Sigma V^{\\rm H}$ 是其奇异值分解，则 $\\Sigma$ 的形状是 ____","options":["A. $m\\times m$","B. $n\\times n$","C. $m\\times n$","D. $n\\times m$"],"a":"C","s":"$U$ 是 $m$ 阶酉矩阵、$V$ 是 $n$ 阶酉矩阵，故中间的 $\\Sigma$ 必须是 $m\\times n$ 的“对角形”矩阵：对角元为 $\\sigma_1,\\cdots,\\sigma_r$，其余元素全为 $0$。"},{"type":"填空","k":"酉矩阵的奇异值","q":"设 $A$ 是 $n$ 阶酉矩阵，则 $A$ 的全部奇异值都等于 ____","options":[],"a":"$1$","s":"$A^{\\rm H}A=E$ 的特征值全为 $1$，故奇异值 $\\sigma_i=\\sqrt1=1$（共 $n$ 个），这与酉矩阵特征值的模为 $1$ 是两个不同的结论。"},{"type":"选择","k":"Hermite 矩阵的奇异值","q":"设 $A$ 是 Hermite 矩阵，其特征值为 $-3,2,0$，则 $A$ 的非零奇异值是 ____","options":["A. $-3$ 与 $2$","B. $3$ 与 $2$","C. $9$ 与 $4$","D. $3$ 与 $-2$"],"a":"B","s":"Hermite 矩阵的奇异值等于其非零特征值的绝对值，故为 $|{-3}|=3$ 与 $|2|=2$；奇异值恒非负，带负号的选项都不对。"}]},"9.1":{"num":"9.1","title":"二次型与矩阵合同","items":[{"type":"选择","k":"二次型矩阵的写法","q":"二次型 $f(x_1,x_2)=x_1x_2$ 的矩阵是（　）","options":["A. $\\begin{pmatrix}0&1\\\\0&0\\end{pmatrix}$","B. $\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$","C. $\\begin{pmatrix}0&\\frac12\\\\\\frac12&0\\end{pmatrix}$","D. $\\begin{pmatrix}1&0\\\\0&1\\end{pmatrix}$"],"a":"C","s":"交叉项系数 $1$ 对半分给 $a_{12},a_{21}$，故 $A=\\begin{pmatrix}0&\\frac12\\\\\\frac12&0\\end{pmatrix}$，且 $x^{\\rm T}Ax=x_1x_2$。"},{"type":"填空","k":"交叉项系数对半分","q":"二次型 $f(x_1,x_2,x_3)=x_1^2+4x_1x_2-6x_1x_3+2x_2x_3+x_3^2$ 的矩阵中 $a_{13}=$ ____","options":[],"a":"$-3$","s":"$2x_1x_3$ 的系数是 $-6$，故 $a_{13}=a_{31}=-\\frac{6}{2}=-3$。"},{"type":"选择","k":"合同的不变量","q":"设 $A,B$ 都是 $n$ 阶实对称矩阵，则 $A$ 与 $B$ 合同当且仅当（　）","options":["A. $A$ 与 $B$ 相似","B. $\\det A=\\det B$","C. $A,B$ 的秩相等且正、负惯性指数分别相同","D. $A,B$ 有相同的特征值"],"a":"C","s":"由惯性定理，秩与正负惯性指数是合同关系的完全不变量；合同不保持特征值与行列式。"},{"type":"填空","k":"正交替换的标准形系数是特征值","q":"用正交线性替换把二次型 $f(x_1,x_2)=x_1^2+2x_1x_2-x_2^2$ 化为标准形，所得标准形为 ____","options":[],"a":"$\\sqrt2 y_1^2-\\sqrt2 y_2^2$","s":"系数矩阵 $\\begin{pmatrix}1&1\\\\1&-1\\end{pmatrix}$ 的特征值为 $\\sqrt2$ 与 $-\\sqrt2$，正交替换下标准形的系数恰为全部特征值。"}]},"9.2":{"num":"9.2","title":"合同变换和惯性定理","items":[{"type":"填空","k":"符号差的计算","q":"二次型 $f(x_1,x_2,x_3,x_4)=x_1^2+2x_2^2-3x_3^2+x_4^2$ 的符号差是 ____","options":[],"a":"$2$","s":"已是对角形：正项 $3$ 个、负项 $1$ 个，即 $p=3,q=1$，符号差 $s=p-q=2$。"},{"type":"选择","k":"规范形的确定","q":"二次型 $f(x_1,x_2)=2x_1x_2$ 的规范形是（　）","options":["A. $y_1^2$","B. $y_1^2+y_2^2$","C. $y_1^2-y_2^2$","D. $-y_1^2-y_2^2$"],"a":"C","s":"$2x_1x_2=\\frac{(x_1+x_2)^2}{2}-\\frac{(x_1-x_2)^2}{2}$，一正一负，故规范形为 $y_1^2-y_2^2$（秩 $2$，符号差 $0$）。"},{"type":"填空","k":"规范形的种类计数","q":"秩为 $3$ 的实二次型，其规范形一共有 ____ 种","options":[],"a":"$4$","s":"由 $(p,q)$ 且 $p+q=3$ 得 $(3,0),(2,1),(1,2),(0,3)$，共 $4$ 种，分别对应 $y_1^2+y_2^2+y_3^2$、$y_1^2+y_2^2-y_3^2$、$y_1^2-y_2^2-y_3^2$、$-y_1^2-y_2^2-y_3^2$。"},{"type":"选择","k":"合同只看惯性指数","q":"设 $A$ 是 $3$ 阶实对称矩阵，特征值为 $1,1,-2$，则 $A$ 与下列哪个矩阵合同（　）","options":["A. $\\begin{pmatrix}1&0&0\\\\0&1&0\\\\0&0&1\\end{pmatrix}$","B. $\\begin{pmatrix}1&0&0\\\\0&1&0\\\\0&0&-1\\end{pmatrix}$","C. $\\begin{pmatrix}1&0&0\\\\0&-1&0\\\\0&0&-1\\end{pmatrix}$","D. $\\begin{pmatrix}1&0&0\\\\0&0&0\\\\0&0&-1\\end{pmatrix}$"],"a":"B","s":"$A$ 的正、负惯性指数为 $2,1$，与 $\\operatorname{diag}(1,1,-1)$ 相同；合同只保惯性指数，不保特征值的具体大小。"}]},"9.3":{"num":"9.3","title":"正定二次型和正定矩阵","items":[{"type":"填空","k":"二阶顺序主子式为零的陷阱","q":"若二次型 $f(x_1,x_2,x_3)=x_1^2+x_2^2+tx_3^2+2x_1x_2$ 正定，则 $t$ 的取值范围是 ____","options":[],"a":"不存在这样的 $t$","s":"二阶顺序主子式 $\\begin{vmatrix}1&1\\\\1&1\\end{vmatrix}=0$，不是正数，故对任何 $t$ 都不正定（只能半正定）。"},{"type":"选择","k":"正定的等价条件","q":"设 $A$ 是 $n$ 阶实对称矩阵，则 $A$ 正定的充要条件是（　）","options":["A. $A$ 的各阶顺序主子式全大于 $0$","B. $A$ 与 $E$ 相似","C. $A$ 与 $E$ 相抵","D. $A$ 的迹大于 $0$"],"a":"A","s":"顺序主子式全正是正定的标准判据；与 $E$ 相似可推出 $A=E$，与 $E$ 相抵只说明 $r(A)=n$，迹大于 $0$ 不能排除负特征值（如 $\\operatorname{diag}(2,-1)$）。"},{"type":"选择","k":"正定矩阵的运算封闭性","q":"设 $A,B$ 都是 $n$ 阶正定矩阵，则下列矩阵一定正定的是（　）","options":["A. $A-B$","B. $AB$","C. $A^{-1}+B$","D. $A^2-B^2$"],"a":"C","s":"$A^{-1}$ 与 $B$ 都正定，正定矩阵之和对任意非零 $X$ 有 $X^{\\rm T}(A^{-1}+B)X>0$；$AB$ 一般不对称，$A-B$、$A^2-B^2$ 的定性不确定。"},{"type":"填空","k":"半正定的特征值刻画","q":"实对称矩阵 $A$ 半正定的充要条件是 $A$ 的全部特征值 ____","options":[],"a":"都大于等于 $0$（即 $\\lambda_i\\ge 0$）","s":"正交替换化为标准形后系数就是特征值，半正定即无负平方项，故要求 $\\lambda_i\\ge 0$。"}]}}};

<script>
/* ==========================================================================
   高代研习录 —— 应用逻辑
   视图函数只返回 { title, sub, html, set }，不直接操作 DOM，
   便于在 Node 中做渲染自测（见 test-app.js）。
   ========================================================================== */
(function (global) {
  'use strict';

  var DATA = global.GA_DATA || { chapters: [] };
  var E = (global.TexLite && global.TexLite.rich) ? global.TexLite.rich : function (s) { return String(s); };
  var LS_KEY = 'ga_daily_v1';

  /* ---------------- 工具 ---------------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    var r = rng || Math.random;
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function fmtDur(secs) {
    var m = Math.floor(secs / 60), s = secs % 60;
    return m > 0 ? ('已用时 ' + m + ' 分 ' + pad2(s) + ' 秒') : ('已用时 ' + s + ' 秒');
  }

  /* ---------------- 每日励志语（按日期取，天天不同） ---------------- */
  var QUOTES = [
    '今天多算一道题，考场上就少慌一分钟。',
    '数学不是看会的，是算会的。',
    '把不会的变成会的，就是今天最大的收获。',
    '公式记不住没关系，做题做到条件反射就行。',
    '慢一点没关系，别停就行。',
    '每一道错题，都是考试前提前暴露的漏洞。',
    '你现在讨厌的那道证明题，考场上可能就是 10 分。',
    '先把这一节吃透，再去下一节——贪多最容易崩。',
    '复习不是重看，是重做。',
    '证明题写不全没关系，先把思路写完整。',
    '把"我好像会"变成"我能从头写到尾"。',
    '理解不了就先记住，做着做着就懂了。',
    '别怕慢，怕的是每天都在重新开始。',
    '课本上的定理，最好能自己推一遍。',
    '考的是熟练度，不是智商。',
    '一行一行写出来，比在脑子里跳步可靠。',
    '今天的 45 分钟，抵得过临考前的三个小时。',
    '遇到难点先标记，别在一道题上耗死。',
    '别人的进度和你无关，你自己的曲线在上升就行。',
    '把易错点抄一遍，比刷十道新题有用。',
    '计算不出错，分数就稳了一半。',
    '每次想放弃的时候，再多做一道。',
    '状态不好就做简单题，保持手感也算赢。',
    '错题本翻三遍，比新题刷三十道强。',
    '定理的条件，就是考试的坑。',
    '先求稳，再求快，最后才求巧。',
    '把大目标拆成今天这一节，压力就没了。',
    '别人的方法可以学，但题必须自己做。',
    '今天写出的每一步，都是考场上的底气。',
    '不会的题记下来，它就不会再坑你第二次。',
    '坚持到考试那天，你会发现题没那么难。',
    '别用"看懂了"骗自己，动笔才算数。',
    '一次只做一件事，做完再抬头。',
    '复习的敌人不是难度，是拖延。',
    '你今天啃下的硬骨头，明天就是你的优势。',
    '累的时候就休息五分钟，然后回来继续。'
  ];
  function quoteOfDay(key) {
    key = key || todayKey();
    return QUOTES[hashStr('q|' + key) % QUOTES.length];
  }

  /* ---------------- 学习会话（后台计时） ---------------- */
  var REST_MIN = 45;              /* 每学习 45 分钟提醒休息 */
  function todayStudySecs() { return Math.round(+(state.study[todayKey()] || 0)); }
  function totalStudySecs() {
    var n = 0;
    for (var k in state.study) n += (+state.study[k] || 0);
    return Math.round(n);
  }
  function fmtStudy(secs) {
    secs = Math.max(0, Math.round(secs));
    var h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
    if (h > 0) return h + ' 小时 ' + m + ' 分';
    if (m > 0) return m + ' 分 ' + (secs % 60) + ' 秒';
    return secs + ' 秒';
  }
  function startSession() {
    if (state.session) return state.session;
    state.session = { start: Date.now(), last: Date.now(), secs: 0 };
    state.landingDone = todayKey();
    saveState();
    return state.session;
  }
  /* 累加时间；返回本次会话累计秒数 */
  function tickSession(now) {
    if (!state.session) return 0;
    now = now || Date.now();
    var d = Math.max(0, now - state.session.last);
    if (d > 3 * 60000) d = 3 * 60000;   /* 睡眠/长时间挂起时不虚增 */
    state.session.last = now;
    state.session.secs += d / 1000;
    var k = todayKey();
    state.study[k] = (+state.study[k] || 0) + d / 1000;
    return Math.round(state.session.secs);
  }
  function endSession() {
    if (!state.session) return { secs: 0 };
    tickSession();
    var out = { secs: Math.round(state.session.secs), day: todayKey() };
    state.session = null;
    state.sessionDone = todayKey();
    saveState();
    return out;
  }
  function sessionSecs() { return state.session ? Math.round(state.session.secs) : 0; }
  function restDue() {
    if (!state.session) return false;
    return state.session.secs >= (state.restCount + 1) * REST_MIN * 60;
  }
  function markRest() { state.restCount = (state.restCount || 0) + 1; state.lastRestTs = Date.now(); saveState(); }
  function fmtDateCn(key) {
    var p = key.split('-');
    return p[0] + ' 年 ' + (+p[1]) + ' 月 ' + (+p[2]) + ' 日';
  }
  var TIER = { 1: '基础', 2: '提高', 3: '挑战' };
  var TIER_DESC = {
    1: '单步或两步即可完成，巩固概念',
    2: '需要一次技巧转折或两步以上推理',
    3: '综合性强，需要巧思或完整构造'
  };

  /* ---------------- 索引 ---------------- */
  var chapters = DATA.chapters || [];
  var secMap = {};   /* num -> {sec, chapter} */
  var allProbs = []; /* {sec, chapter, p, i, key} */
  chapters.forEach(function (ch) {
    ch.sections.forEach(function (sec) {
      secMap[sec.num] = { sec: sec, chapter: ch };
      (sec.problems || []).forEach(function (p, i) {
        allProbs.push({ sec: sec, chapter: ch, p: p, i: i, key: sec.num + '#' + i });
      });

  });
  var probByKey = {};
  allProbs.forEach(function (x) { probByKey[x.key] = x; });

  /* ---------------- 刷教材 / 选择填空 索引 ---------------- */
  var TB = DATA.textbook || {};      /* num -> {num,title,problems:[{src,tier,tag,k,q,s}]} */
  var CF = DATA.choicefill || {};    /* num -> {num,title,items:[{type,k,q,options,a,s}]} */
  var tbByNum = {};                  /* num -> [题对象]（结构与 allProbs 一致，便于复用卡片/记录/导出） */
  var tbProbs = [];
  Object.keys(TB).forEach(function (num) {
    var ref = secMap[num];
    if (!ref) return;
    var list = [];
    (TB[num].problems || []).forEach(function (p, i) {
      var x = {
        sec: ref.sec, chapter: ref.chapter,
        p: { t: +p.tier === 2 ? 2 : 1, q: p.q, s: p.s, k: p.k },
        key: 'TB' + num + '#' + i, i: i, isTB: true, tag: p.tag || '', src: p.src || ''
      };
      tbProbs.push(x); list.push(x); probByKey[x.key] = x;
    });
    tbByNum[num] = list;
  });
  var cfByNum = {};
  Object.keys(CF).forEach(function (num) {
    if (!secMap[num]) return;
    cfByNum[num] = CF[num].items || [];
  });
  var cfKeys = {};   /* key -> {num, idx, item} */
  Object.keys(cfByNum).forEach(function (num) {
    cfByNum[num].forEach(function (it, i) { cfKeys['CF' + num + '#' + i] = { num: num, idx: i, item: it }; });
  });
  function tbOf(num) { return tbByNum[num] || []; }
  function cfOf(num) { return cfByNum[num] || []; }
  /* 原创题 + 教材题的合集（错题本、搜索等要一视同仁） */
  var everyProb = allProbs.concat(tbProbs);
  function tbSections() {
    var out = [];
    chapters.forEach(function (ch) {
      ch.sections.forEach(function (sec) { if (tbOf(sec.num).length) out.push({ sec: sec, chapter: ch, list: tbOf(sec.num) }); });
    });
    return out;
  }
  function cfSections() {
    var out = [];
    chapters.forEach(function (ch) {
      ch.sections.forEach(function (sec) { if (cfOf(sec.num).length) out.push({ sec: sec, chapter: ch, list: cfOf(sec.num) }); });
    });
    return out;
  }

  function chapterSections(ch) { return ch.sections || []; }
  function probsOfSection(num) {
    return allProbs.filter(function (x) { return x.sec.num === num; });
  }
  function probsOfChapter(ch) {
    var out = [];
    ch.sections.forEach(function (s) {
      out = out.concat(probsOfSection(s.num));
    });
    return out;
  }
  function tierOf(x) { return +x.p.t || 1; }

  /* ---------------- 状态 ---------------- */
  var state = null;

  function defaultState() {
    return {
      v: 1,
      rec: {},        /* key -> {st:'ok'|'bad', ts} */
      stars: {},      /* key -> 1 */
      daily: {},      /* date -> {keys:[], done:bool} */
      batch: 0,       /* 今日三题「换一批」计数 */
      scope: 'all',
      streak: { last: '', count: 0 },
      tests: [],      /* {ch, ts, n, ok, bad} */
      lastSel: [],
      quizN: 10,
      quizRun: null,
      testRun: null,
      fixed: {},          /* 曾做错、后来做对的题 */
      skipOk: true,       /* 抽题时排除已做对的题 */
      searchQ: '',
      searchUndone: false,
      searchWrong: false,
      /* —— 学习会话与时长 —— */
      study: {},          /* date -> 累计秒数 */
      session: null,      /* {start:int, last:int, secs:int} 进行中的学习会话 */
      sessionDone: '',    /* 当天已「结束今日学习」的日期 */
      restCount: 0,       /* 本次会话已提示休息的次数 */
      lastRestTs: 0,
      landingDone: '',    /* 当天是否已从首页进入 */
      cfRec: {},          /* 选择填空作答记录 key -> {pick, right:bool, ts} */
      quizMixTB: 3        /* 周小测插入几道教材原题 */
    };
  }
  function loadState() {
    try {
      var raw = global.localStorage && global.localStorage.getItem(LS_KEY);
      if (!raw) return defaultState();
      var s = JSON.parse(raw);
      var d = defaultState();
      for (var k in d) if (!(k in s)) s[k] = d[k];
      return s;
    } catch (e) { return defaultState(); }
  }
  function saveState() {
    try {
      if (global.localStorage) global.localStorage.setItem(LS_KEY, JSON.stringify(state));
    } catch (e) { /* 忽略 */ }
  }

  /* ---------------- 备份导入：结构校验 + 补默认值 ----------------
     “是个对象”远远不够：缺字段/字段类型错的 JSON 会让统计页直接崩，
     所以这里逐字段校验，非法项丢掉、可修的补默认值，最后才写回。      */
  var QUIZ_N_ALLOWED = [6, 8, 10, 12, 15, 20];
  function isPlainObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
  function sanitizeImported(raw) {
    if (!isPlainObj(raw)) return { ok: false, err: '文件内容不是一个学习记录对象' };
    var out = defaultState();
    var dropped = 0, repaired = 0;

    function numOr(v, fb) { var n = Number(v); return isFinite(n) ? n : fb; }

    /* 做题记录：key 必须是题库里真实存在的题，st 只能是 ok/bad */
    if (raw.rec !== undefined) {
      if (!isPlainObj(raw.rec)) { dropped++; }
      else {
        Object.keys(raw.rec).forEach(function (k) {
          var r = raw.rec[k];
          if (!probByKey[k]) { dropped++; return; }
          if (!isPlainObj(r) || (r.st !== 'ok' && r.st !== 'bad')) { dropped++; return; }
          var ts = numOr(r.ts, 0);
          if (!(ts > 0)) { ts = Date.now(); repaired++; }
          out.rec[k] = { st: r.st, ts: ts };
        });
      }
    }

    /* 收藏 / 已订正名单：只保留合法题号 */
    ['stars', 'fixed'].forEach(function (field) {
      if (raw[field] === undefined) return;
      if (!isPlainObj(raw[field])) { dropped++; return; }
      Object.keys(raw[field]).forEach(function (k) {
        if (!probByKey[k]) { dropped++; return; }
        out[field][k] = field === 'stars' ? 1 : numOr(raw[field][k], Date.now());
      });
    });

    /* 打卡记录：date -> {keys:[], done:bool} */
    if (raw.daily !== undefined) {
      if (!isPlainObj(raw.daily)) { dropped++; }
      else {
        Object.keys(raw.daily).forEach(function (k) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) { dropped++; return; }
          var v = raw.daily[k];
          if (!isPlainObj(v)) { dropped++; return; }
          var keys = Array.isArray(v.keys) ? v.keys.filter(function (x) { return probByKey[x]; }) : [];
          out.daily[k] = { keys: keys, done: v.done === true };
        });
      }
    }

    /* 章节测试成绩表 */
    if (raw.tests !== undefined) {
      if (!Array.isArray(raw.tests)) { dropped++; }
      else {
        out.tests = raw.tests.filter(function (t) {
          if (!isPlainObj(t) || t.ch === undefined) { dropped++; return false; }
          if (!chapters.some(function (c) { return c.num === String(t.ch); })) { dropped++; return false; }
          return true;
        }).map(function (t) {
          var okN = Math.max(0, Math.floor(numOr(t.ok, 0)));
          var badN = Math.max(0, Math.floor(numOr(t.bad, 0)));
          var n = Math.max(okN + badN, Math.floor(numOr(t.n, okN + badN)));
          if (t.ok === undefined || t.bad === undefined) repaired++;
          return { ch: String(t.ch), ts: numOr(t.ts, Date.now()), n: n, ok: okN, bad: badN };
        }).slice(-200);
      }
    }

    /* 未完成的测试 / 小测：题号必须真实存在，否则丢掉（避免渲染空页） */
    function validRun(run, withSel) {
      if (!isPlainObj(run) || !Array.isArray(run.keys)) return null;
      var keys = run.keys.filter(function (k) { return !!probByKey[k]; });
      if (!keys.length) return null;
      if (keys.length !== run.keys.length) repaired++;
      var o = { keys: keys, ts: numOr(run.ts, Date.now()) };
      if (withSel) {
        o.n = Math.floor(numOr(run.n, keys.length));
        o.sel = Array.isArray(run.sel) ? run.sel.filter(function (n) { return !!secMap[n]; }) : [];
        if (!o.sel.length) return null;
      } else {
        o.ch = String(run.ch === undefined ? '' : run.ch);
        if (!chapters.some(function (c) { return c.num === o.ch; })) return null;
        o.submitted = run.submitted === true;
        o.reveal = run.reveal === true;
        if (o.reveal) o.submitTs = numOr(run.submitTs, o.ts);
      }
      return o;
    }
    if (raw.testRun !== undefined) {
      out.testRun = validRun(raw.testRun, false);
      if (!out.testRun && raw.testRun !== null) dropped++;
    }
    if (raw.quizRun !== undefined) {
      out.quizRun = validRun(raw.quizRun, true);
      if (!out.quizRun && raw.quizRun !== null) dropped++;
    }

    /* 周小测勾选的节 */
    if (raw.lastSel !== undefined) {
      if (!Array.isArray(raw.lastSel)) { dropped++; }
      else out.lastSel = raw.lastSel.filter(function (n) { return !!secMap[n]; });
    }

    /* 标量字段：类型不对就回退默认值 */
    if (raw.quizN !== undefined) {
      var qn = Math.floor(numOr(raw.quizN, 0));
      if (QUIZ_N_ALLOWED.indexOf(qn) >= 0) out.quizN = qn; else repaired++;
    }
    if (raw.batch !== undefined) out.batch = Math.max(0, Math.floor(numOr(raw.batch, 0)));
    if (raw.scope !== undefined) {
      var sc = String(raw.scope);
      var known = sc === 'all' || chapters.some(function (c) { return c.num === sc; });
      out.scope = known ? sc : 'all';
      if (!known) repaired++;
    }
    if (raw.streak !== undefined) {
      if (isPlainObj(raw.streak)) {
        out.streak = { last: typeof raw.streak.last === 'string' ? raw.streak.last : '', count: Math.max(0, Math.floor(numOr(raw.streak.count, 0))) };
      } else { dropped++; }
    }
    ['skipOk', 'searchUndone', 'searchWrong'].forEach(function (f) {
      if (raw[f] === undefined) return;
      if (typeof raw[f] !== 'boolean') { repaired++; return; }
      out[f] = raw[f];
    });
    if (raw.searchQ !== undefined) out.searchQ = typeof raw.searchQ === 'string' ? raw.searchQ : '';
    /* 版本号等未知字段一律忽略；旧备份缺的字段由 defaultState 兜住 */

    return { ok: true, state: out, dropped: dropped, repaired: repaired };
  }
  function st(key) { var r = state.rec[key]; return r ? r.st : ''; }
  function mark(key, v) {
    var old = state.rec[key] ? state.rec[key].st : '';
    if (!v) { delete state.rec[key]; delete state.fixed[key]; }
    else {
      state.rec[key] = { st: v, ts: Date.now() };
      if (v === 'ok' && old === 'bad') state.fixed[key] = Date.now();
      if (v === 'bad') delete state.fixed[key];
    }
    saveState();
  }
  function toggleStar(key) {
    if (state.stars[key]) delete state.stars[key]; else state.stars[key] = 1;
    saveState();
  }
  function countsOfChapter(ch) {
    var all = probsOfChapter(ch), done = 0, ok = 0;
    all.forEach(function (x) {
      var s = st(x.key);
      if (s) done++;
      if (s === 'ok') ok++;
    });
    return { total: all.length, done: done, ok: ok };
  }
  function streakDays() {
    var n = 0;
    var d = new Date();
    var k = todayKey(d);
    var hasToday = state.daily[k] && state.daily[k].done;
    if (!hasToday) d.setDate(d.getDate() - 1);
    for (var guard = 0; guard < 2000; guard++) {
      var kk = todayKey(d);
      if (state.daily[kk] && state.daily[kk].done) { n++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return n;
  }
  function resetTodayKeys() {
    var t = todayKey();
    var old = state.daily[t];
    state.daily[t] = { keys: [], done: !!(old && old.done) };
    saveState();
  }
  function totalCheckedIn() {
    var n = 0;
    for (var k in state.daily) if (state.daily[k].done) n++;
    return n;
  }

  /* ---------------- 抽题 ---------------- */
  function preferUnseen(list, seenBefore) {
    if (!seenBefore) return list;
    return list.slice().sort(function (a, b) {
      return (st(a.key) ? 1 : 0) - (st(b.key) ? 1 : 0);
    });
  }
  function pickTier(pool, tier, n, rng, skipOk) {
    var arr = pool.filter(function (x) { return tierOf(x) === tier; });
    if (skipOk) {
      var fresh = arr.filter(function (x) { return st(x.key) !== 'ok'; });
      if (fresh.length >= n) arr = fresh;
    }
    shuffle(arr, rng);
    arr = preferUnseen(arr);
    return arr.slice(0, n);
  }
  function poolByScope(scope) {
    if (!scope || scope === 'all') return allProbs.slice();
    var ch = chapters.filter(function (c) { return c.num === String(scope); })[0];
    return ch ? probsOfChapter(ch) : allProbs.slice();
  }
  function scopeLabel(scope) {
    if (!scope || scope === 'all') return '全部章节';
    var ch = chapters.filter(function (c) { return c.num === String(scope); })[0];
    return ch ? ('第 ' + ch.num + ' 章 ' + stripTex(ch.title)) : '全部章节';
  }
  function stripTex(s) { return String(s).replace(/\$[^$]*\$/g, function (m) { return m.replace(/\$/g, ''); }).replace(/[\\{}]/g, ''); }

  /* ---------------- 题目卡片 ---------------- */
  function probCard(x, idx, opt) {
    opt = opt || {};
    var key = x.key;
    var s = st(key);
    var cls = 'prob' + (s === 'ok' ? ' st-ok' : s === 'bad' ? ' st-bad' : '') + (state.stars[key] ? ' starred' : '');
    var showSol = !!opt.showSol;
    var html = '';
    html += '<article class="' + cls + '" data-key="' + esc(key) + '" data-t="' + tierOf(x) + '">';
    html += '<div class="prob-head">';
    if (opt.showIdx !== false) html += '<span class="idx">' + (idx != null ? (idx + 1) + '.' : '') + '</span>';
    html += '<span class="badge t' + tierOf(x) + '">' + TIER[tierOf(x)] + '</span>';
    if (x.isTB) html += '<span class="badge src" title="教材原题">教材 ' + esc(x.src || '') + '</span>';
    if (opt.showSec) html += '<span class="badge sec">' + esc(stripTex(x.sec.title)) + '（' + x.sec.num + '）</span>';
    if (x.p.k) html += '<span class="badge k">' + esc(x.p.k) + '</span>';
    if (opt.editable !== false) {
      html += '<span class="prob-actions">';
      html += '<button class="iconbtn' + (s === 'ok' ? ' on' : '') + '" data-act="mark" data-key="' + esc(key) + '" data-v="ok" title="标记做对" aria-label="标记这道题做对了" aria-pressed="' + (s === 'ok') + '">✔ 做对</button>';
      html += '<button class="iconbtn' + (s === 'bad' ? ' on bad' : '') + '" data-act="mark" data-key="' + esc(key) + '" data-v="bad" title="标记做错，进入错题本" aria-label="标记这道题做错了" aria-pressed="' + (s === 'bad') + '">✘ 做错</button>';
      html += '<button class="iconbtn' + (state.stars[key] ? ' on star' : '') + '" data-act="star" data-key="' + esc(key) + '" title="收藏" aria-label="收藏这道题" aria-pressed="' + (!!state.stars[key]) + '">☆</button>';
      html += '</span>';
    }
    html += '</div>';
    html += '<div class="q">' + E(x.p.q) + '</div>';
    html += '<div class="sol" ' + (showSol ? '' : 'hidden') + '><div class="solhd">答案与解析</div>' + E(x.p.s) + '</div>';
    if (opt.editable !== false) {
      html += '<div class="row" style="margin-top:10px"><button class="btn small ghost" data-act="sol" data-key="' + esc(key) + '">' + (showSol ? '收起解析' : '显示解析') + '</button></div>';
    }
    html += '</article>';
    return html;
  }
  function probList(items, opt) {
    return items.map(function (x, i) { return probCard(x, i, opt); }).join('');
  }

  function pitfallsCard(list, title) {
    var h = '<div class="card pitfall" style="margin-top:14px"><div class="pithd">⚠ ' + esc(title || '易错点提醒') + '</div><ul class="pitlist">';
    list.forEach(function (pf) {
      h += '<li><b>' + esc(pf.k) + '</b>' + E(pf.v) + '</li>';
    });
    return h + '</ul></div>';
  }

  /* ---------------- 顶部工具条（含导出） ---------------- */
  function toolbar(extra) {
    return '<div class="toolbar">' +
      (extra || '') +
      '<span class="spacer"></span>' +
      '<button class="btn small" data-act="export" data-kind="pdf">下载 PDF</button>' +
      '</div>';
  }

  /* ---------------- 视图：今日三题 ---------------- */
  function viewToday() {
    var d = todayKey();
    var rec = state.daily[d];
    if (!rec || !rec.keys || !rec.keys.length) {
      var rng = mulberry32(hashStr(d + '|' + state.scope + '|' + state.batch));
      var pool = poolByScope(state.scope);
      var picked = [];
      [1, 2, 3].forEach(function (t) {
        var one = pickTier(pool, t, 1, rng, state.skipOk);
        if (one.length) picked = picked.concat(one);
      });
      if (picked.length < 3) {
        var rest = shuffle(pool.slice(), rng).filter(function (x) { return picked.indexOf(x) < 0; });
        while (picked.length < 3 && rest.length) picked.push(rest.shift());
      }
      rec = { keys: picked.map(function (x) { return x.key; }), done: !!(rec && rec.done) };
      state.daily[d] = rec;
      saveState();
    }
    var items = rec.keys.map(function (k) { return probByKey[k]; }).filter(Boolean);
    var marked = items.filter(function (x) { return st(x.key) === 'ok'; }).length;
    var streak = streakDays();

    var scopeOpts = '<option value="all"' + (state.scope === 'all' ? ' selected' : '') + '>全部章节（综合）</option>';
    chapters.forEach(function (ch) {
      scopeOpts += '<option value="' + ch.num + '"' + (String(state.scope) === ch.num ? ' selected' : '') + '>第 ' + ch.num + ' 章 ' + esc(stripTex(ch.title)) + '</option>';
    });

    var html = '';
    html += '<div class="pagehead"><div class="crumb">' + fmtDateCn(d) + ' · 星期' + '日一二三四五六'[new Date().getDay()] +
      '<span class="daily-quote" title="每天换一句">“' + esc(quoteOfDay(d)) + '”</span></div>';
    html += '<h1>今日三题</h1><div class="sub">每天 3 道，难度依次递增：基础 → 提高 → 挑战。同一天内题目固定，第二天自动更换。</div></div>';

    html += '<div class="stats">' +
      '<div class="stat"><div class="v">' + streak + '</div><div class="l">连续打卡（天）</div></div>' +
      '<div class="stat"><div class="v">' + totalCheckedIn() + '</div><div class="l">累计打卡（天）</div></div>' +
      '<div class="stat"><div class="v">' + marked + '/3</div><div class="l">今日已做对</div></div>' +
      '<div class="stat"><div class="v">' + Object.keys(state.rec).length + '</div><div class="l">题库中已做过的题</div></div>' +
      '</div>';

    html += toolbar(
      '<span class="label">范围</span><select data-act="scope">' + scopeOpts + '</select>' +
      '<button class="btn small" data-act="redraw">换一批</button>' +
      '<label class="chk" style="margin-left:6px"><input type="checkbox" data-act="skipok"' +
      (state.skipOk ? ' checked' : '') + '> 不重复抽已做对的题</label>' +
      '<button class="btn small" data-act="solall">全部显示解析</button>'
    );

    if (!items.length) {
      html += '<div class="empty">题库还没有内容。</div>';
    } else {
      html += probList(items, { showSol: false, showSec: true });
    }

    html += '<div class="row" style="margin-top:6px">' +
      '<button class="btn primary" data-act="checkin"' + (rec.done ? ' disabled' : '') + '>' + (rec.done ? '今日已打卡 ✓' : '完成今日打卡') + '</button>' +
      '<button class="btn" data-act="go" data-view="browse">去分章分节练习</button>' +
      '</div>';

    return {
      title: '今日三题',
      html: html,
      set: {
        title: '今日三题 · ' + d,
        sub: fmtDateCn(d) + '　范围：' + scopeLabel(state.scope) + '　难度：基础 → 提高 → 挑战',
        items: items
      }
    };
  }

  /* ---------------- 视图：分章分节总览 ---------------- */
  function viewBrowse() {
    var html = '<div class="pagehead"><h1>分章分节</h1><div class="sub">点开章节，选择小节即可随机抽 3 道（一易一中一难）；每章都有章节测试。</div></div>';
    if (state.testRun) {
      var tr = state.testRun;
      var trSecs = Math.max(0, Math.floor(((tr.reveal ? (tr.submitTs || tr.ts) : Date.now()) - tr.ts) / 1000));
      if (tr.reveal) {
        /* 已交卷但还没点「保存成绩并结束」——必须显眼提示，否则换个测试就静默丢了 */
        html += '<div class="note warn pending" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
          '<span>第 ' + esc(tr.ch) + ' 章的测试<b>已交卷但成绩还没保存</b>（用时 ' +
          fmtDur(trSecs).replace('已用时 ', '') + '）。现在开别的测试会丢掉这次成绩。</span>' +
          '<span class="spacer" style="flex:1"></span>' +
          '<button class="btn small primary" data-act="gotest" data-ch="' + esc(tr.ch) + '">去保存成绩</button>' +
          '<button class="btn small" data-act="testabandon">丢弃</button></div>';
      } else {
        html += '<div class="note warn" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
          '<span>有一份<b>没交卷的章节测试</b>：第 ' + esc(tr.ch) + ' 章，开始于 ' + new Date(tr.ts).toLocaleString() +
          '（' + fmtDur(trSecs).replace('已用时 ', '已用 ') + '）</span><span class="spacer" style="flex:1"></span>' +
          '<button class="btn small primary" data-act="gotest" data-ch="' + esc(tr.ch) + '">继续上次测试</button>' +
          '<button class="btn small" data-act="testabandon">放弃</button></div>';
      }
    }
    chapters.forEach(function (ch) {
      var c = countsOfChapter(ch);
      var pct = c.total ? Math.round(c.done / c.total * 100) : 0;
      html += '<div class="card" style="margin-bottom:14px">';
      html += '<div class="row" style="align-items:flex-start">' +
        '<div style="flex:1;min-width:200px">' +
        '<div style="font-size:16px;font-weight:700">第 ' + ch.num + ' 章　' + E(ch.title) + '</div>' +
        '<div style="color:#6b7a93;font-size:12.8px;margin-top:2px">' + E(ch.subtitle || '') + '</div>' +
        '</div>' +
        '<button class="btn small" data-act="gotest" data-ch="' + ch.num + '">章节测试</button>' +
        (ch.sections[0] && ch.sections[0].url ? '<a class="btn small" href="' + esc(ch.sections[0].url) +
          '" target="_blank" rel="noopener" title="打开教材本章起始页">教材 ↗</a>' : '') +
        '</div>';
      html += '<div style="margin:12px 0 10px"><div class="progress"><i style="width:' + pct + '%"></i></div>' +
        '<div style="font-size:12px;color:#8798b3;margin-top:5px">已做 ' + c.done + ' / ' + c.total + ' 题（做对 ' + c.ok + '）</div></div>';
      html += '<div class="row">';
      ch.sections.forEach(function (sec) {
        html += '<span style="display:inline-flex;align-items:center;gap:3px">' +
          '<button class="btn small" data-act="gosec" data-sec="' + sec.num + '">' +
          '<b style="color:#2f6bff">' + sec.num + '</b> ' + E(sec.title) + '</button>' +
          '<button class="btn small ghost" data-act="goprev" data-sec="' + sec.num + '" title="课前预习：本节骨架 + 定理三连问（' +
          ((sec.theorems || []).length) + ' 张定理卡）">预习' + ((sec.theorems || []).length > 1 ? '·' + (sec.theorems || []).length : '') + '</button>' +
          '</span>';
      });
      html += '</div></div>';
    });
    return { title: '分章分节', html: html, set: null };
  }

  /* ---------------- 视图：某一节 ---------------- */
  function viewSection(num, mode) {
    var ref = secMap[num];
    if (!ref) return { title: '未找到', html: '<div class="empty">没有找到小节 ' + esc(num) + '。</div>', set: null };
    var sec = ref.sec, ch = ref.chapter;
    var pool = probsOfSection(num);
    var items;
    if (mode === 'all') {
      items = pool;
    } else {
      var rng = mulberry32(hashStr('sec' + num + '|' + Date.now()));
      items = [];
      [1, 2, 3].forEach(function (t) {
        var one = pickTier(pool, t, 1, rng, state.skipOk);
        if (one.length) items = items.concat(one);
      });
    }
    var cnt = { 1: 0, 2: 0, 3: 0 };
    pool.forEach(function (x) { cnt[tierOf(x)]++; });

    var html = '';
    html += '<div class="crumb">第 ' + ch.num + ' 章 ' + E(ch.title) + ' / <b>' + sec.num + '</b></div>';
    html += '<div class="pagehead"><h1>' + E(sec.title) + '</h1>' +
      '<div class="sub">' + (sec.pts ? '核心考点：' + E(sec.pts) : '') + '</div>';
    if (sec.url) {
      html += '<div style="margin-top:8px"><a class="btn small" href="' + esc(sec.url) +
        '" target="_blank" rel="noopener">📖 打开教材本节原文 ↗</a></div>';
    }
    html += '</div>';
    html += '<div class="note">本节共 <b>' + pool.length + '</b> 道题：基础 ' + cnt[1] + ' · 提高 ' + cnt[2] + ' · 挑战 ' + cnt[3] +
      '。默认随机抽 3 道，难度依次递增；同一节可反复抽，系统会优先抽你还没做过的题。' +
      '核心定理 <b>' + ((sec.theorems || []).length) + '</b> 张，可在「课前预习」里看本节骨架。</div>';
    if (sec.pitfalls && sec.pitfalls.length) html += pitfallsCard(sec.pitfalls, '本节易错点（按知识点）');
    html += toolbar(
      '<button class="btn small" data-act="goprev" data-sec="' + sec.num + '">📖 课前预习（定理 ' + ((sec.theorems || []).length) + ' 张）</button>' +
      '<button class="btn small primary" data-act="redrawsec" data-sec="' + sec.num + '">随机抽 3 道</button>' +
      '<button class="btn small" data-act="gosec" data-sec="' + sec.num + '" data-mode="all">看本节全部 ' + pool.length + ' 题</button>' +
      '<label class="chk"><input type="checkbox" data-act="skipok"' + (state.skipOk ? ' checked' : '') + '> 不重复抽已做对的题</label>' +
      '<button class="btn small" data-act="solall">全部显示解析</button>'
    );
    html += probList(items, { showSol: false, showSec: false });
    html += '<div class="row" style="margin-top:8px">' +
      '<button class="btn" data-act="go" data-view="browse">← 返回章节列表</button>' +
      '<button class="btn" data-act="gotest" data-ch="' + ch.num + '">做第 ' + ch.num + ' 章章节测试</button>' +
      '</div>';

    return {
      title: sec.title,
      html: html,
      set: {
        title: sec.num + ' ' + stripTex(sec.title),
        sub: '第 ' + ch.num + ' 章 ' + stripTex(ch.title) + (sec.pts ? '　核心考点：' + stripTex(sec.pts) : ''),
        items: items
      }
    };
  }

  /* ---------------- 视图：章节测试 ---------------- */
  function startTest(chNum) {
    var ch = chapters.filter(function (c) { return c.num === String(chNum); })[0];
    if (!ch) return null;
    var pool = probsOfChapter(ch);
    var rng = mulberry32(hashStr('test' + chNum + '|' + Date.now()));
    var keys = [];
    var plan = [[1, 2], [2, 3], [3, 3]];
    plan.forEach(function (pl) {
      var got = pickTier(pool, pl[0], pl[1], rng, state.skipOk);
      got.forEach(function (x) { keys.push(x.key); });
    });
    /* 数量不足时用其余题补齐 */
    if (keys.length < 8) {
      var rest = shuffle(pool.slice(), rng);
      for (var i = 0; i < rest.length && keys.length < 8; i++) {
        if (keys.indexOf(rest[i].key) < 0) keys.push(rest[i].key);
      }
    }
    state.testRun = { ch: String(chNum), keys: keys, ts: Date.now(), submitted: false, reveal: false };
    saveState();
    return state.testRun;
  }

  function viewTest(chNum, fresh) {
    var prevRun = state.testRun;
    var canResume = !fresh && prevRun && prevRun.ch === String(chNum);
    if (fresh || !canResume) startTest(chNum);
    var run = state.testRun;
    var resumed = !!(fresh ? false : canResume);
    if (!run) return { title: '章节测试', html: '<div class="empty">这一章题量不足。</div>', set: null };
    var ch = chapters.filter(function (c) { return c.num === run.ch; })[0];
    var items = run.keys.map(function (k) { return probByKey[k]; }).filter(Boolean);
    /* 交卷后冻结用时，不再继续走表 */
    var counted = run.reveal ? (run.submitTs || run.ts) : Date.now();
    var secs = Math.max(0, Math.floor((counted - run.ts) / 1000));
    var mins = Math.floor(secs / 60);
    /* 实际构成（某档题不足时与模板不同，文案必须按实际算） */
    var mix = { 1: 0, 2: 0, 3: 0 };
    items.forEach(function (x) { mix[tierOf(x)]++; });
    var mixText = '共 ' + items.length + ' 题：基础 ' + mix[1] + ' · 提高 ' + mix[2] + ' · 挑战 ' + mix[3];

    var html = '';
    html += '<div class="crumb">第 ' + ch.num + ' 章 ' + E(ch.title) + ' / <b>章节测试</b></div>';
    html += '<div class="pagehead"><h1>第 ' + ch.num + ' 章 章节测试</h1>' +
      '<div class="sub">' + mixText + '。建议限时 90 分钟，做完再点「交卷看答案」。</div></div>';
    if (resumed && !run.reveal) {
      html += '<div class="note warn">这是<b>上次没做完的测试</b>，已从离开时的进度继续（开始于 ' +
        new Date(run.ts).toLocaleString() + '）。想换一套新题，点右侧「放弃并重开」。</div>';
    }
    if (resumed && run.reveal) {
      html += '<div class="note warn pending">这份测试<b>已交卷</b>（交卷用时 ' + fmtDur(secs).replace('已用时 ', '') +
        '），但成绩还没保存。逐题核对「✔ 做对 / ✘ 做错」后点下方「保存成绩并结束」；在此之前去开别的章节测试会丢掉这次成绩。</div>';
    }
    html += toolbar(
      '<span class="timer' + (run.reveal ? ' done' : (secs > 90 * 60 ? ' danger' : '')) + '"' +
      (run.reveal ? ' data-frozen="1"' : '') + ' data-act="tick" data-since="' + run.ts + '">' +
      fmtDur(secs) + (run.reveal ? '（已交卷）' : '') + '</span>' +
      '<button class="btn small' + (run.reveal ? '' : ' primary') + '" data-act="submit">' + (run.reveal ? '重新开始' : '交卷看答案') + '</button>' +
      '<span class="label">' + (run.reveal ? '答案已展开，请逐题自评（做对/做错）' : '暂不显示答案') + '</span>' +
      (run.reveal ? '' : '<button class="btn small" data-act="testrestart">放弃并重开</button>')
    );
    if (run.reveal) {
      var markedOk = 0, markedBad = 0;
      run.keys.forEach(function (kk) { var s0 = st(kk); if (s0 === 'ok') markedOk++; if (s0 === 'bad') markedBad++; });
      var unmarked = items.length - markedOk - markedBad;
      html += probList(items, { showSol: true, showSec: true });
      html += '<div class="card pending-card"><div class="row"><div style="font-weight:600">自评汇总</div><span class="spacer"></span>' +
        '<button class="btn small primary" data-act="finishtest">保存成绩并结束</button></div>' +
        '<div style="font-size:13px;color:#6b7a93;margin-top:6px">已评：做对 ' + markedOk + ' · 做错 ' + markedBad +
        (unmarked > 0 ? ' · <b style="color:#b23b37">还有 ' + unmarked + ' 题未评</b>' : ' · 全部已评') +
        '。做错的题会自动进入错题本。成绩不保存 = 这次白考，别直接切到别的章节测试。</div></div>';
    } else {
      html += probList(items, { showSol: false, showSec: true, editable: true });
      html += '<div class="note warn">先在本子上认真写，再交卷。交卷后答案会全部展开（已标记的做对/做错记录会保留）。</div>';
    }
    html += '<div class="row" style="margin-top:8px"><button class="btn" data-act="go" data-view="browse">← 返回章节列表</button></div>';

    return {
      title: '第' + ch.num + '章 章节测试',
      html: html,
      set: {
        title: '第 ' + ch.num + ' 章 章节测试　' + stripTex(ch.title),
        sub: mixText + '　建议限时 90 分钟　' + todayKey(),
        items: items
      }
    };
  }

  /* ---------------- 视图：周小测 ---------------- */
  function viewQuizSetup() {
    var html = '';
    html += '<div class="pagehead"><h1>周小测</h1><div class="sub">勾选这周学过的节，系统会从这些节里抽题：既有基础题，也有提高和挑战题。</div></div>';
    html += '<div class="note">用法：每周日（或你想检验的那天）勾选本周学过的节 → 选题量 → 生成小测。生成后可「下载 PDF」当卷子用，做完再对答案。</div>';

    html += '<div class="card" style="margin-bottom:14px"><div class="row">' +
      '<span class="label">题量</span>' +
      '<select data-act="quizn">' +
      [6, 8, 10, 12, 15, 20].map(function (n) {
        return '<option value="' + n + '"' + (+state.quizN === n ? ' selected' : '') + '>' + n + ' 题</option>';
      }).join('') +
      '</select>' +
      '<span class="label">难度配比：基础 30% / 提高 40% / 挑战 30%</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn small" data-act="quizselall">全选</button>' +
      '<button class="btn small" data-act="quizselnone">清空</button>' +
      '<button class="btn primary small" data-act="quizgen">生成小测</button>' +
      '</div></div>';

    html += '<div class="picker">';
    chapters.forEach(function (ch) {
      var secs = ch.sections;
      var allChecked = secs.every(function (s) { return state.lastSel.indexOf(s.num) >= 0; });
      html += '<div class="grp"><div class="grphd">' +
        '<label class="chk"><input type="checkbox" data-act="quizch" data-ch="' + ch.num + '"' + (allChecked ? ' checked' : '') + '>' +
        '第 ' + ch.num + ' 章　' + E(ch.title) + '</label>' +
        '<span class="spacer"></span><span style="font-weight:400;color:#8798b3;font-size:12px">' + secs.length + ' 节</span>' +
        '</div><div class="grpbody">';
      secs.forEach(function (sec) {
        html += '<label class="chk"><input type="checkbox" data-act="quizsec" value="' + sec.num + '"' +
          (state.lastSel.indexOf(sec.num) >= 0 ? ' checked' : '') + '>' + sec.num + ' ' + E(sec.title) + '</label>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    html += '<div class="row" style="margin-top:16px"><button class="btn primary" data-act="quizgen">生成小测</button></div>';
    return { title: '周小测', html: html, set: null };
  }

  function genQuiz() {
    var sel = state.lastSel.slice();
    if (!sel.length) return { err: '请至少勾选一节。' };
    var pool = [];
    sel.forEach(function (num) {
      if (secMap[num]) pool = pool.concat(probsOfSection(num));
    });
    if (pool.length < 3) return { err: '勾选的节题量太少。' };
    var n = +state.quizN || 10;
    var n1 = Math.max(1, Math.round(n * 0.3));
    var n3 = Math.max(1, Math.round(n * 0.3));
    var n2 = Math.max(1, n - n1 - n3);
    var rng = mulberry32(hashStr('quiz' + sel.join(',') + '|' + Date.now()));
    var keys = [];
    [[1, n1], [2, n2], [3, n3]].forEach(function (pl) {
      pickTier(pool, pl[0], pl[1], rng, state.skipOk).forEach(function (x) { keys.push(x.key); });
    });
    if (keys.length < n) {
      var rest = shuffle(pool.slice(), rng);
      for (var i = 0; i < rest.length && keys.length < n; i++) {
        if (keys.indexOf(rest[i].key) < 0) keys.push(rest[i].key);
      }
    }
    /* 按基础→提高→挑战排序，视觉上由易到难 */
    keys.sort(function (a, b) { return tierOf(probByKey[a]) - tierOf(probByKey[b]); });
    /* 混入几道教材原题（默认 3 道，优先取自勾选的节） */
    var nTB = Math.max(0, Math.min(+state.quizMixTB || 0, tbProbs.length));
    if (nTB > 0) {
      var tbPool = tbProbs.slice();
      shuffle(tbPool, rng);
      var pickedTB = [];
      tbPool.forEach(function (x) {
        if (pickedTB.length < nTB && sel.indexOf(x.sec.num) >= 0) pickedTB.push(x);
      });
      tbPool.forEach(function (x) {
        if (pickedTB.length < nTB && pickedTB.indexOf(x) < 0) pickedTB.push(x);
      });
      pickedTB.forEach(function (x) { keys.push(x.key); });
      keys.sort(function (a, b) { return tierOf(probByKey[a]) - tierOf(probByKey[b]); });
    }
    state.quizRun = { keys: keys, ts: Date.now(), n: n, sel: sel };
    saveState();
    return { ok: true };
  }

  function viewQuizRun() {
    var run = state.quizRun;
    if (!run || !run.keys.length) return viewQuizSetup();
    var items = run.keys.map(function (k) { return probByKey[k]; }).filter(Boolean);
    var secNames = run.sel.map(function (n) {
      var r = secMap[n];
      return r ? (n + ' ' + stripTex(r.sec.title)) : n;
    }).join(' · ');
    var html = '';
    html += '<div class="crumb">周小测 / <b>' + fmtDateCn(todayKey()) + '</b></div>';
    html += '<div class="pagehead"><h1>本周小测（' + items.length + ' 题）</h1>' +
      '<div class="sub">覆盖小节：' + esc(secNames) + '　难度：基础 → 提高 → 挑战</div></div>';
    html += toolbar(
      '<button class="btn small primary" data-act="quizagain">换一套</button>' +
      '<button class="btn small" data-act="solall">全部显示解析</button>' +
      '<button class="btn small" data-act="go" data-view="quizsetup">修改勾选</button>'
    );
    html += probList(items, { showSol: false, showSec: true });
    return {
      title: '本周小测',
      html: html,
      set: {
        title: '高等代数 周小测　' + todayKey(),
        sub: '覆盖：' + secNames + '　共 ' + items.length + ' 题　难度：基础 → 提高 → 挑战',
        items: items
      }
    };
  }

  /* ---------------- 视图：错题本 ---------------- */
  function viewWrong(params) {
    params = params || {};
    var badAll = everyProb.filter(function (x) { return st(x.key) === 'bad'; });
    var fixedAll = everyProb.filter(function (x) { return st(x.key) === 'ok' && state.fixed && state.fixed[x.key]; });
    var starred = everyProb.filter(function (x) { return state.stars[x.key]; });
    /* 导出/打印的集合要按 key 去重：同一题可能既是错题、又被订正过、还收藏了 */
    var seen = {}, exportItems = [];
    badAll.concat(fixedAll, starred).forEach(function (x) {
      if (seen[x.key]) return;
      seen[x.key] = 1; exportItems.push(x);
    });
    var html = '<div class="pagehead"><h1>错题本</h1><div class="sub">按章分组：做错的题留在「待复习」，重做并标记为做对后会自动移到「已订正」。</div></div>';
    if (!badAll.length && !fixedAll.length && !starred.length) {
      html += '<div class="empty">还没有记录。做题时点「✘ 做错」或「☆ 收藏」，就会出现在这里。</div>';
      return { title: '错题本', html: html, set: null };
    }
    var fixedTotal = badAll.length + fixedAll.length;
    html += '<div class="stats" style="margin-bottom:14px">' +
      '<div class="stat"><div class="v" style="color:#b23b37">' + badAll.length + '</div><div class="l">待复习</div></div>' +
      '<div class="stat"><div class="v" style="color:#1c7d52">' + fixedAll.length + '</div><div class="l">已订正</div></div>' +
      '<div class="stat"><div class="v">' + (fixedTotal ? Math.round(fixedAll.length / fixedTotal * 100) : 0) + '%</div><div class="l">订正率</div></div>' +
      '<div class="stat"><div class="v">' + starred.length + '</div><div class="l">收藏</div></div>' +
      '</div>';
    if (badAll.length) {
      html += toolbar('<button class="btn small" data-act="clearwrong">清空「待复习」标记</button>');
      chapters.forEach(function (ch) {
        var its = badAll.filter(function (x) { return x.chapter.num === ch.num; });
        if (!its.length) return;
        html += '<div class="wgroup"><div class="wghd"><span>第 ' + ch.num + ' 章 ' + E(ch.title) + '</span>' +
          '<span class="cnt">' + its.length + ' 道待复习</span><span class="spacer"></span>' +
          '<button class="btn small ghost" data-act="gosec" data-sec="' + its[0].sec.num + '">去练这一节</button></div>';
        html += probList(its, { showSol: false, showSec: true });
        html += '</div>';
      });
    } else {
      html += '<div class="empty">待复习的错题已清空，继续保持。</div>';
    }
    if (fixedAll.length) {
      var showAllFixed = !!params.allfixed;
      var fixedShown = (showAllFixed || fixedAll.length <= 30) ? fixedAll : fixedAll.slice(0, 30);
      html += '<div class="pagehead" style="margin-top:20px"><h1 style="font-size:17px">已订正（' + fixedAll.length + '）</h1>' +
        '<div class="sub">这些题曾做错、后来标注为做对，自动收在这里留档。若又错了，点「✘」它会回到待复习。</div></div>';
      html += '<div class="row" style="margin-bottom:10px"><button class="btn small" data-act="unfixall">清空订正名单</button>' +
        (fixedAll.length > 30
          ? (showAllFixed
            ? '<button class="btn small" data-act="fixedfold">只看前 30 条</button>'
            : '<button class="btn small primary" data-act="fixedall">展开全部 ' + fixedAll.length + ' 条</button>')
          : '') +
        '</div>';
      html += '<div class="wgroup wgroup-fixed">' + probList(fixedShown, { showSol: false, showSec: true }) + '</div>';
      if (fixedAll.length > 30 && !showAllFixed) {
        html += '<div class="row" style="margin-top:10px"><button class="btn small" data-act="fixedall">展开全部 ' +
          fixedAll.length + ' 条（还有 ' + (fixedAll.length - 30) + ' 条未显示）</button></div>';
      }
    }
    if (starred.length) {
      html += '<div class="pagehead" style="margin-top:22px"><h1 style="font-size:17px">收藏的题（' + starred.length + '）</h1></div>';
      html += probList(starred, { showSol: false, showSec: true });
    }
    return {
      title: '错题本',
      html: html,
      set: {

  /* ---------------- 视图：统计 ---------------- */
  function viewStats() {
    var done = 0, ok = 0, bads = 0;
    allProbs.forEach(function (x) {
      var s = st(x.key);
      if (s) done++;
      if (s === 'ok') ok++;
      if (s === 'bad') bads++;
    });
    var total = allProbs.length;
    var rate = done ? Math.round(ok / done * 100) : 0;
    var html = '<div class="pagehead"><h1>学习统计</h1><div class="sub">数据保存在本机浏览器里（换电脑或清缓存会丢失，建议定期导出备份）。</div></div>';
    html += '<div class="stats">' +
      '<div class="stat"><div class="v">' + streakDays() + '</div><div class="l">连续打卡（天）</div></div>' +
      '<div class="stat"><div class="v">' + totalCheckedIn() + '</div><div class="l">累计打卡（天）</div></div>' +
      '<div class="stat"><div class="v">' + done + '<span style="font-size:13px;color:#8798b3">/' + total + '</span></div><div class="l">已做题数</div></div>' +
      '<div class="stat"><div class="v">' + rate + '%</div><div class="l">自评正确率</div></div>' +
      '<div class="stat"><div class="v">' + bads + '</div><div class="l">错题待复习</div></div>' +
      '</div>';

    html += '<div class="card"><div style="font-weight:700;margin-bottom:12px">各章进度</div><div class="chart">';
    chapters.forEach(function (ch) {
      var c = countsOfChapter(ch);
      var pct = c.total ? Math.round(c.done / c.total * 100) : 0;
      var okRate = c.done ? Math.round(c.ok / c.done * 100) : 0;
      html += '<div class="line"><span class="nm">第 ' + ch.num + ' 章 ' + esc(stripTex(ch.title)) + '</span>' +
        '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
        '<span class="n">' + c.done + '/' + c.total + '</span>' +
        '<span class="n" style="flex:0 0 54px;color:#1c7d52">' + (c.done ? okRate + '%' : '—') + '</span></div>';
    });
    html += '</div></div>';

    /* 打卡日历（最近 13 周） */
    var nowD = new Date(); nowD.setHours(12, 0, 0, 0);
    var weekStart = new Date(nowD); weekStart.setDate(nowD.getDate() - nowD.getDay());
    var firstDay = new Date(weekStart); firstDay.setDate(weekStart.getDate() - 12 * 7);
    var calCells = '';
    for (var wi = 0; wi < 13; wi++) {
      for (var di = 0; di < 7; di++) {
        var curD = new Date(firstDay); curD.setDate(firstDay.getDate() + wi * 7 + di);
        var ck = todayKey(curD);
        var cRec = state.daily[ck];
        var cCls = 'calcell';
        if (curD > nowD) cCls += ' future';
        else if (cRec && cRec.done) cCls += ' on';
        if (ck === todayKey()) cCls += ' today';
        calCells += '<span class="' + cCls + '" title="' + ck + ((cRec && cRec.done) ? ' 已打卡' : '') + '"></span>';
      }
    }
    /* 每日学习时长（自动计时 + 「结束今日学习」汇总而来） */
    var studyDays = [];
    for (var si = 13; si >= 0; si--) {
      var sd = new Date(); sd.setHours(12, 0, 0, 0); sd.setDate(sd.getDate() - si);
      var sk = todayKey(sd);
      studyDays.push({ key: sk, label: (sd.getMonth() + 1) + '/' + sd.getDate(), secs: Math.round(+(state.study[sk] || 0)) });
    }
    var maxStudy = Math.max(60, Math.max.apply(null, studyDays.map(function (x) { return x.secs; })));
    var studyBars = studyDays.map(function (x) {
      var w = Math.round(x.secs / maxStudy * 100);
      return '<div class="srow"><span class="sday">' + x.label + '</span>' +
        '<span class="sbar"><i style="width:' + w + '%"></i></span>' +
        '<span class="sval">' + (x.secs >= 60 ? fmtStudy(x.secs) : (x.secs > 0 ? x.secs + ' 秒' : '—')) + '</span></div>';
    }).join('');
    var studyStreak = 0;
    (function () {
      var d0 = new Date(); d0.setHours(12, 0, 0, 0);
      if ((state.study[todayKey(d0)] || 0) < 60) d0.setDate(d0.getDate() - 1);
      for (var i = 0; i < 400; i++) {
        if ((state.study[todayKey(d0)] || 0) >= 60) { studyStreak++; d0.setDate(d0.getDate() - 1); } else break;
      }
    })();
    var live = sessionSecs();
    var studySum14 = studyDays.reduce(function (a, x) { return a + x.secs; }, 0);
    var studyActive14 = studyDays.filter(function (x) { return x.secs >= 60; }).length;
    var studyAvg = studyActive14 ? Math.round(studySum14 / studyActive14) : 0;
    html += '<div class="card" style="margin-top:14px"><div style="font-weight:700;margin-bottom:10px">每日学习时长' +
      (live > 0 ? '　<span class="label" style="color:#1c7d52">本次进行中 ' + fmtStudy(live) + '</span>' : '') + '</div>' +
      '<div class="stats" style="margin-bottom:12px">' +
      '<div class="stat"><div class="v">' + fmtStudy(todayStudySecs()) + '</div><div class="l">今日学习</div></div>' +
      '<div class="stat"><div class="v">' + fmtStudy(totalStudySecs()) + '</div><div class="l">累计学习</div></div>' +
      '<div class="stat"><div class="v">' + studyStreak + '</div><div class="l">连续学习（天，≥1 分钟）</div></div>' +
      '<div class="stat"><div class="v">' + (studyAvg ? fmtStudy(studyAvg) : '—') + '</div><div class="l">近 14 天日均</div></div>' +
      '</div>' +
      '<div class="study-chart">' + studyBars + '</div>' +
      '<div style="font-size:12px;color:#8798b3;margin-top:8px">计时方式：从「开始今日学习 / 复盘错题」进入后自动累计，点侧栏「结束今日学习」结算。' +
      '每满 ' + REST_MIN + ' 分钟会提醒你休息。</div></div>';

    html += '<div class="card" style="margin-top:14px"><div style="font-weight:700;margin-bottom:8px">打卡日历（最近 13 周）</div>' +
      '<div class="cal">' + calCells + '</div>' +
      '<div class="callegend"><span class="calcell"></span>未打卡<span class="calcell on"></span>已打卡<span class="calcell today"></span>今天</div></div>';

    /* 最近 14 天做题情况 */
    var dayList = [];
    for (var di2 = 13; di2 >= 0; di2--) {
      var dd = new Date(); dd.setHours(12, 0, 0, 0); dd.setDate(dd.getDate() - di2);
      dayList.push({ key: todayKey(dd), label: (dd.getMonth() + 1) + '/' + dd.getDate(), ok: 0, bad: 0 });
    }
    var idxOf = {};
    dayList.forEach(function (dd2, i2) { idxOf[dd2.key] = i2; });
    Object.keys(state.rec).forEach(function (kk2) {
      var rr = state.rec[kk2];
      if (!rr || !rr.ts) return;
      var dk = todayKey(new Date(rr.ts));
      var i3 = idxOf[dk];
      if (i3 == null) return;
      if (rr.st === 'ok') dayList[i3].ok++;
      else if (rr.st === 'bad') dayList[i3].bad++;
    });
    var maxN = 1;
    dayList.forEach(function (d3) { maxN = Math.max(maxN, d3.ok + d3.bad); });
    var trendBars = dayList.map(function (d4) {
      var tot = d4.ok + d4.bad;
      var h = Math.round(tot / maxN * 46);
      var okH = tot ? Math.round(d4.ok / tot * h) : 0;
      var badH = h - okH;
      return '<span class="tbar" title="' + d4.label + '：做对 ' + d4.ok + '，做错 ' + d4.bad + '">' +
        '<i class="tbad" style="height:' + badH + 'px"></i><i class="tok" style="height:' + okH + 'px"></i></span>';
    }).join('');
    var trendLabels = dayList.map(function (d5) { return '<span class="tlbl">' + d5.label + '</span>'; }).join('');
    html += '<div class="card" style="margin-top:14px"><div style="font-weight:700;margin-bottom:8px">最近 14 天做题情况</div>' +
      '<div class="trend">' + trendBars + '</div><div class="trendlabels">' + trendLabels + '</div>' +
      '<div class="callegend"><span class="sw ok"></span>做对<span class="sw bad"></span>做错（按标注时间统计）</div></div>';

    if (state.tests.length) {
      html += '<div class="card" style="margin-top:14px"><div style="font-weight:700;margin-bottom:10px">章节测试记录</div>' +
        '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
        '<tr style="color:#8798b3;text-align:left"><th style="padding:4px 6px">时间</th><th>章节</th><th>做对</th><th>做错</th><th>正确率</th></tr>';
      state.tests.slice().reverse().slice(0, 12).forEach(function (t) {
        var rt = t.ok + t.bad ? Math.round(t.ok / (t.ok + t.bad) * 100) : 0;
        html += '<tr><td style="padding:5px 6px;border-top:1px solid #eef1f7">' + new Date(t.ts).toLocaleDateString() + '</td>' +
          '<td style="border-top:1px solid #eef1f7">第 ' + esc(t.ch) + ' 章</td>' +
          '<td style="border-top:1px solid #eef1f7;color:#1c7d52">' + t.ok + '</td>' +
          '<td style="border-top:1px solid #eef1f7;color:#b23b37">' + t.bad + '</td>' +
          '<td style="border-top:1px solid #eef1f7">' + rt + '%</td></tr>';
      });
      html += '</table></div>';
    }

    html += '<div class="card" style="margin-top:14px"><div class="row">' +
      '<button class="btn small" data-act="backup">导出备份（JSON）</button>' +
      '<label class="btn small" style="cursor:pointer">导入备份<input type="file" accept=".json" data-act="restore" hidden></label>' +
      '<span class="spacer"></span>' +
      '<button class="btn small" data-act="reset" style="color:#b23b37">清空全部学习记录</button>' +
      '</div></div>';
    return { title: '学习统计', html: html, set: null };
  }

      ' 张。</div></div>';
